    /* =====================================================
       CHROMATIC NOTES
    ===================================================== */

    const chromaticNotes = [

      "C",
      "C#",
      "D",
      "Eb",
      "E",
      "F",
      "F#",
      "G",
      "G#",
      "A",
      "Bb",

    /* =====================================================
       NOTE TO NUMBER
    ===================================================== */

    function noteToNumber(note) {

      const map = {

        "C": 0,
        "B#": 0,

        "C#": 1,
        "Db": 1,

        "D": 2,

        "D#": 3,
        "Eb": 3,

        "E": 4,
        "Fb": 4,

        "F": 5,
        "E#": 5,

        "F#": 6,
        "Gb": 6,

        "G": 7,

        "G#": 8,
        "Ab": 8,

        "A": 9,

        "A#": 10,
        "Bb": 10,

        "B": 11,
        "Cb": 11

      };

      return map[note];

    }


    /* =====================================================
       TRANSPOSE NOTE
    ===================================================== */

    function transposeNote(
      note,
      amount
    ) {

      const number =
        noteToNumber(
          note
        );


      if (
        number === undefined
      ) {

        return note;

      }


      let newNumber =
        (
          number +
          amount
        ) % 12;


      if (
        newNumber < 0
      ) {

        newNumber += 12;

      }


      return chromaticNotes[
        newNumber
      ];

    }


    /* =====================================================
       TRANSPOSE CHORDS
    ===================================================== */

    function transposeChords(
      text,
      amount
    ) {

      if (
        !text ||
        amount === 0
      ) {

        return text;

      }


      let result = text;


      /*
        Examples handled:

        C
        Cm
        C7
        Cmaj7
        Cadd9
        C/G
        F#m7
        Bb
        Gsus4
      */


      const chordRegex =
        /(^|[\s(\[\{,;:\-])([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|\+|-|[0-9]|\/|[\s)\]\},;:.]|$))/g;


      result =
        result.replace(
          chordRegex,
          function(
            fullMatch,
            separator,
            root
          ) {

            return (
              separator +
              transposeNote(
                root,
                amount
              )
            );

          }
        );


      /*
        Slash bass notes

        C/G
        D/F#
        Bb/D
      */


      const bassRegex =
        /\/([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|\+|-|[0-9]|[\s)\]\},;:.]|$))/g;


      result =
        result.replace(
          bassRegex,
          function(
            fullMatch,
            bassNote
          ) {

            return (
              "/" +
              transposeNote(
                bassNote,
                amount
              )
            );

          }
        );


      return result;

    }


    /* =====================================================
       GET ORIGINAL KEY
    ===================================================== */

    function getOriginalKey(
      text
    ) {

      if (!text) {

        return "-";

      }


      /*
        First try:

        (D)
        D
        (Bb)
        F#
      */

      const keyAtStart =
        text.match(
          /^\s*\(?([A-G](?:#|b)?)\)?/
        );


      if (keyAtStart) {

        return keyAtStart[1];

      }


      /*
        Otherwise find first chord.
      */

      const firstChord =
        text.match(
          /(?:^|[\s(\[])([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|[0-9]|\/|[\s)\],;:.]|$))/
        );


      if (!firstChord) {

        return "-";

      }


      return firstChord[1];

    }


    /* =====================================================
       GET DISPLAYED KEY
    ===================================================== */

    function getDisplayedKey(
      text,
      amount
    ) {

      const originalKey =
        getOriginalKey(
          text
        );


      const number =
        noteToNumber(
          originalKey
        );


      if (
        number === undefined
      ) {

        return "-";

      }


      let newNumber =
        (
          number +
          amount
        ) % 12;


      if (
        newNumber < 0
      ) {

        newNumber += 12;

      }


      return chromaticNotes[
        newNumber
      ];

    }

        "block";

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    async function login() {

      if (
        loginInProgress
      ) {

        return;

      }


      const email =
        loginEmail.value
          .trim();

      const password =
        loginPassword.value;


      /*
        Validate email
      */

      if (!email) {

        loginMessage.textContent =
          "Please enter your email.";

        loginEmail.focus();

        return;

      }


      /*
        Validate password
      */

      if (!password) {

        loginMessage.textContent =
          "Please enter your password.";

        loginPassword.focus();

        return;

      }


      loginInProgress =
        true;


      loginButton.disabled =
        true;

      loginButton.textContent =
        "Signing in...";

      loginMessage.textContent =
        "Connecting to Firebase...";


      /*
        Timeout protection.

        This prevents the button from
        being stuck on "Signing in..."
        forever.
      */

      let timeoutId;


      try {

        const loginPromise =
          auth.signInWithEmailAndPassword(
            email,
            password
          );


        const timeoutPromise =
          new Promise(
            function(
              resolve,
              reject
            ) {

              timeoutId =
                setTimeout(
                  function() {

                    reject({
                      code:
                        "custom/timeout",

                      message:
                        "Firebase did not respond within 10 seconds."
                    });

                  },
                  10000
                );

            }
          );


        const result =
          await Promise.race([
            loginPromise,
            timeoutPromise
          ]);


        clearTimeout(
          timeoutId
        );


        console.log(
          "LOGIN SUCCESS:",
          result.user.email
        );


        loginMessage.textContent =
          "Login successful.";


        /*
          Show the songs page.
        */

        showHome();


        /*
          Load songs.
        */

        loadSongs();


      }
      catch(error) {

        clearTimeout(
          timeoutId
        );


        console.error(
          "FIREBASE LOGIN ERROR:",
          error
        );


        let errorMessage =
          "Unable to sign in.";


        if (
          error.code ===
          "auth/invalid-email"
        ) {

          errorMessage =
            "Invalid email address.";

        }


        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          errorMessage =
            "No Firebase account exists with this email.";

        }


        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          errorMessage =
            "Incorrect password.";

        }


        else if (
          error.code ===
          "auth/invalid-credential"
        ) {

          errorMessage =
            "Incorrect email or password.";

        }


        else if (
          error.code ===
          "auth/user-disabled"
        ) {

          errorMessage =
            "This Firebase account has been disabled.";

        }


        else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          errorMessage =
            "Too many attempts. Please try again later.";

        }


        else if (
          error.code ===
          "auth/network-request-failed"
        ) {

          errorMessage =
            "Network error. Check your internet connection.";

        }


        else if (
          error.code ===
          "auth/operation-not-allowed"
        ) {

          errorMessage =
            "Email/password sign-in is not enabled in Firebase.";

        }


        else if (
          error.code ===
          "custom/timeout"
        ) {

          errorMessage =
            "Firebase is not responding. Refresh the page and try again.";

        }


        else if (
          error.message
        ) {

          errorMessage =
            error.message;

        }


        loginMessage.textContent =
          errorMessage;

      }


      finally {

        loginInProgress =
          false;

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";

      }

    }


    /* =====================================================
       LOGIN BUTTON
    ===================================================== */

    loginButton.addEventListener(
      "click",
      login
    );


    /* =====================================================
       ENTER TO LOGIN
    ===================================================== */

    loginPassword.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          login();

        }

      }
    );


    /* =====================================================
       REQUEST ACCESS
    ===================================================== */

    requestButton.addEventListener(
      "click",
      showRequestPage
    );


    /* =====================================================
       BACK TO LOGIN
    ===================================================== */

    document
      .getElementById(
        "backLogin"
      )
      .addEventListener(
        "click",
        showLoginPage
      );


    /* =====================================================
       SUBMIT ACCESS REQUEST
    ===================================================== */

    document
      .getElementById(
        "submitRequestButton"
      )
      .addEventListener(
        "click",
        function() {

          const name =
            requestName.value
              .trim();

          const email =
            requestEmail.value
              .trim();

          const reason =
            requestReason.value
              .trim();


          if (!name) {

            requestMessage.textContent =
              "Please enter your name.";

            return;

          }


          if (!email) {

            requestMessage.textContent =
              "Please enter your email.";

            return;

          }


          if (!reason) {

            requestMessage.textContent =
              "Please tell us why you need access.";

            return;

          }


          requestMessage.textContent =
            "Sending request...";


          const callbackName =
            "accessRequest_" +
            Date.now();


          window[callbackName] =
            function(response) {

              requestMessage.textContent =
                response.message ||
                "Request submitted.";


              if (
                response.success
              ) {

                requestName.value =
                  "";

                requestEmail.value =
                  "";

                requestReason.value =
                  "";

              }


              delete window[
                callbackName
              ];


              const script =
                document.getElementById(
                  "accessRequestScript"
                );


              if (script) {

                script.remove();

              }

            };


          const script =
            document.createElement(
              "script"
            );


          script.id =
            "accessRequestScript";


          script.src =
            API_URL +
            "?action=requestAccess" +
            "&name=" +
            encodeURIComponent(
              name
            ) +
            "&email=" +
            encodeURIComponent(
              email
            ) +
            "&reason=" +
            encodeURIComponent(
              reason
            ) +
            "&callback=" +
            encodeURIComponent(
              callbackName
            );


          script.onerror =
            function() {

              requestMessage.textContent =
                "Unable to send request. Please try again.";


              delete window[
                callbackName
              ];


              script.remove();

            };


          document.body.appendChild(
            script
          );

        }
      );


    /* =====================================================
       LOGOUT
    ===================================================== */

    logoutButton.addEventListener(
      "click",
      async function() {

        try {

          await auth.signOut();

          currentSong =
            null;

          songs = [];

          showLoginPage();

          loginEmail.value =
            "";

          loginPassword.value =
            "";

          loginMessage.textContent =
            "";

          songsContainer.innerHTML =
            "";

        }
        catch(error) {

          console.error(
            "Logout error:",
            error
          );

        }

      }
    );


   /* =====================================================
   FIREBASE AUTH STATE
===================================================== */

let authInitialized = false;

auth.onAuthStateChanged(
  function(user) {

    console.log(
      "AUTH STATE:",
      user ? user.email : "Not logged in"
    );

    /*
      Firebase fires this when it first checks
      the existing authentication state.

      Do not force the login screen while a
      login request is currently happening.
    */

    if (!authInitialized) {

      authInitialized = true;

      if (user) {

        console.log(
          "Existing session found:",
          user.email
        );

        showHome();

        loadSongs();

      }
      else {

        showLoginPage();

      }

      return;
    }


    /*
      After initialization, normal auth changes.
    */

    if (user) {

      console.log(
        "User authenticated:",
        user.email
      );

      showHome();

      loadSongs();

    }
    else {

      /*
        Only return to login when the user
        is actually signed out.
      */

      if (!loginInProgress) {

        showLoginPage();

      }

    }

  },

  function(error) {

    console.error(
      "Auth state error:",
      error
    );

    showLoginPage();

    loginMessage.textContent =
      "Firebase authentication error.";

  }
);

    /* =====================================================
       LOAD SONGS
    ===================================================== */

    function loadSongs() {

      message.textContent =
        "Loading songs...";


      songsContainer.innerHTML =
        "";


      const callbackName =
        "receiveSongs_" +
        Date.now();


      window[callbackName] =
        function(data) {

          try {

            songs =
              Array.isArray(data)
                ? data
                : [];


            /*
              Sort alphabetically.
            */

            songs.sort(
              function(a, b) {

                return String(
                  a.name || ""
                ).localeCompare(
                  String(
                    b.name || ""
                  ),
                  undefined,
                  {
                    sensitivity:
                      "base"
                  }
                );

              }
            );


            displaySongs(
              songs
            );


          }
          catch(error) {

            console.error(
              "Song processing error:",
              error
            );

            message.textContent =
              "Unable to process songs.";

          }


          delete window[
            callbackName
          ];


          const oldScript =
            document.getElementById(
              "songsApiScript"
            );


          if (oldScript) {

            oldScript.remove();

          }

        };


      const script =
        document.createElement(
          "script"
        );


      script.id =
        "songsApiScript";


      script.src =
        API_URL +
        "?action=getSongs" +
        "&callback=" +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          console.error(
            "Apps Script failed."
          );


          message.textContent =
            "Unable to load songs. Please try again.";


          delete window[
            callbackName
          ];


          script.remove();

        };


      document.body.appendChild(
        script
      );

    }


    /* =====================================================
       DISPLAY SONGS
    ===================================================== */

    function displaySongs(
      list
    ) {

      songsContainer.innerHTML =
        "";


      if (
        !list ||
        list.length === 0
      ) {

        message.textContent =
          "No songs found.";

        return;

      }


      message.textContent =
        "";


      list.forEach(
        function(song) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "song";


          div.textContent =
            song.name ||
            "Untitled";


          div.addEventListener(
            "click",
            function() {

              openSong(
                song
              );

            }
          );


          songsContainer.appendChild(
            div
          );

        }
      );

    }


    /* =====================================================
       HOME SEARCH
    ===================================================== */

    search.addEventListener(
      "input",
      function() {

        const searchText =
          this.value
            .trim()
            .toLowerCase();


        if (
          !searchText
        ) {

          displaySongs(
            songs
          );

          return;

        }


        const filtered =
          songs.filter(
            function(song) {

              return String(
                song.name || ""
              )
              .toLowerCase()
              .includes(
                searchText
              );

            }
          );


        displaySongs(
          filtered
        );

      }
    );


    /* =====================================================
       SONG SEARCH
    ===================================================== */

    songSearch.addEventListener(
      "input",
      function() {

        const searchText =
          this.value
            .trim()
            .toLowerCase();


        if (
          !searchText
        ) {

          songSearchResults.style.display =
            "none";

          songSearchResults.innerHTML =
            "";

          return;

        }


        const matches =
          songs.filter(
            function(song) {

              return String(
                song.name || ""
              )
              .toLowerCase()
              .includes(
                searchText
              );

            }
          );


        songSearchResults.innerHTML =
          "";


        if (
          matches.length === 0
        ) {

          const noResults =
            document.createElement(
              "div"
            );


          noResults.className =
            "song-search-no-results";


          noResults.textContent =
            "No songs found.";


          songSearchResults.appendChild(
            noResults
          );


          songSearchResults.style.display =
            "block";

          return;

        }


        matches
          .slice(
            0,
            15
          )
          .forEach(
            function(song) {

              const result =
                document.createElement(
                  "div"
                );


              result.className =
                "song-search-result";


              result.textContent =
                song.name;


              result.addEventListener(
                "click",
                function() {

                  openSongFromSearch(
                    song
                  );

                }
              );


              songSearchResults.appendChild(
                result
              );

            }
          );


        songSearchResults.style.display =
          "block";

      }
    );


    /* =====================================================
       OPEN SONG FROM SEARCH
    ===================================================== */

    function openSongFromSearch(
      song
    ) {

      songSearch.value =
        "";

      songSearchResults.innerHTML =
        "";

      songSearchResults.style.display =
        "none";


      openSong(
        song
      );

    }


    /* =====================================================
       CLOSE SEARCH RESULTS
    ===================================================== */

    document.addEventListener(
      "click",
      function(event) {

        const container =
          document.querySelector(
            ".song-search-container"
          );


        if (
          container &&
          !container.contains(
            event.target
          )
        ) {

          songSearchResults.style.display =
            "none";

        }

      }
    );


    /* =====================================================
       OPEN SONG
    ===================================================== */

    function openSong(
      song
    ) {

      currentSong =
        song;


      transposeAmount =
        0;


      homePage.style.display =
        "none";


      songPage.style.display =
        "block";


      songTitle.textContent =
        song.name ||
        "Untitled";


      songSearch.value =
        "";

      songSearchResults.innerHTML =
        "";

      songSearchResults.style.display =
        "none";


      updateSong();


      window.scrollTo(
        0,
        0
      );

    }


    /* =====================================================
       BACK TO SONGS
    ===================================================== */

    document
      .getElementById(
        "backButton"
      )
      .addEventListener(
        "click",
        showHome
      );


    /* =====================================================
       TRANSPOSE UP
    ===================================================== */

    document
      .getElementById(
        "transposeUpButton"
      )
      .addEventListener(
        "click",
        function() {

          if (
            !currentSong
          ) {

            return;

          }


          transposeAmount++;

          updateSong();

        }
      );


    /* =====================================================
       TRANSPOSE DOWN
    ===================================================== */

    document
      .getElementById(
        "transposeDownButton"
      )
      .addEventListener(
        "click",
        function() {

          if (
            !currentSong
          ) {

            return;

          }


          transposeAmount--;

          updateSong();

        }
      );


    /* =====================================================
       UPDATE SONG
    ===================================================== */

    function updateSong() {

      if (
        !currentSong
      ) {

        return;

      }


      const original =
        String(
          currentSong.chords || ""
        );


      const transposed =
        transposeChords(
          original,
          transposeAmount
        );


      chords.textContent =
        transposed;


      keyDisplay.textContent =
        "Key: " +
        getDisplayedKey(
          original,
          transposeAmount
        );

    }


    /* =====================================================
       START
    ===================================================== */

    showLoginPage();

  </script>

</body>

</html>
