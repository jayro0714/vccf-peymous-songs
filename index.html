<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VCCF Peymous Songs List</title>


  <!-- =====================================================
       FIREBASE
       ===================================================== -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background: #0f172a;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    /* =====================================================
       LOGIN PAGE
       ===================================================== */

    #loginPage {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    .login-box {

      width: 100%;

      max-width: 400px;

      background: #1e293b;

      padding: 32px;

      border-radius: 15px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25);

    }


    .login-title {

      text-align: center;

      margin-bottom: 5px;

      font-size: 30px;

      font-weight: bold;

    }


    .login-icon {

      color: #8b5cf6;

    }


    .login-subtitle {

      text-align: center;

      color: #94a3b8;

      margin-bottom: 25px;

      font-size: 15px;

    }


    .login-input {

      width: 100%;

      padding: 13px 14px;

      margin-bottom: 12px;

      background: white;

      color: #111827;

      border: none;

      border-radius: 8px;

      outline: none;

      font-size: 15px;

    }


    .login-button {

      width: 100%;

      padding: 13px;

      margin-top: 4px;

      background: #2563eb;

      color: white;

      border: none;

      border-radius: 8px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

    }


    .login-button:hover {

      background: #1d4ed8;

    }


    .login-button:disabled {

      opacity: 0.7;

      cursor: not-allowed;

    }


    .request-button {

      width: 100%;

      padding: 11px;

      margin-top: 10px;

      background: transparent;

      color: #60a5fa;

      border: 1px solid #475569;

      border-radius: 8px;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

    }


    .request-button:hover {

      background: #243247;

    }


    #loginMessage {

      margin-top: 15px;

      text-align: center;

      color: #94a3b8;

      font-size: 14px;

      line-height: 1.4;

    }



    /* =====================================================
       MAIN PAGE
       ===================================================== */

    #appPage {

      display: none;

      min-height: 100vh;

      padding: 28px 20px 50px;

    }


    .app-container {

      max-width: 1000px;

      margin: 0 auto;

    }


    .page-title {

      text-align: center;

      margin: 0 0 30px;

      font-size: 34px;

    }


    .controls {

      display: flex;

      gap: 5px;

      max-width: 590px;

      margin: 0 auto 30px;

    }


    #searchInput {

      flex: 1;

      min-width: 0;

      padding: 13px 16px;

      background: white;

      color: #111827;

      border: none;

      border-radius: 10px;

      outline: none;

      font-size: 15px;

    }


    #logoutButton {

      padding: 0 18px;

      background: transparent;

      color: #60a5fa;

      border: 1px solid #475569;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

    }


    #logoutButton:hover {

      background: #1e293b;

    }


    #songsContainer {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(280px, 1fr)
        );

      gap: 15px;

    }


    .song-card {

      background: #1e293b;

      border: 1px solid #293548;

      border-radius: 12px;

      padding: 18px;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease;

    }


    .song-card:hover {

      transform: translateY(-2px);

      background: #243247;

    }


    .song-name {

      font-size: 17px;

      font-weight: bold;

      color: white;

    }


    .song-preview {

      margin-top: 8px;

      color: #94a3b8;

      font-size: 13px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    #statusMessage {

      text-align: center;

      color: #94a3b8;

      margin-top: 50px;

      font-size: 15px;

    }



    /* =====================================================
       SONG MODAL
       ===================================================== */

    #songModal {

      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.75);

      z-index: 1000;

      padding: 20px;

      overflow-y: auto;

    }


    .modal-box {

      max-width: 800px;

      margin: 40px auto;

      background: #1e293b;

      border-radius: 15px;

      padding: 25px;

    }


    .modal-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 20px;

    }


    .modal-title {

      margin: 0;

      font-size: 25px;

    }


    .close-button {

      width: 36px;

      height: 36px;

      background: transparent;

      border: 1px solid #475569;

      color: white;

      border-radius: 8px;

      cursor: pointer;

      font-size: 20px;

    }


    .close-button:hover {

      background: #334155;

    }


    .chords {

      background: #0f172a;

      border-radius: 10px;

      padding: 20px;

      white-space: pre-wrap;

      font-family:
        Consolas,
        monospace;

      line-height: 1.7;

      color: #e2e8f0;

      overflow-x: auto;

    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      .page-title {

        font-size: 27px;

      }


      .controls {

        flex-direction: column;

      }


      #logoutButton {

        padding: 11px;

      }


      .login-box {

        padding: 25px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <section id="loginPage">

    <div class="login-box">

      <div class="login-title">

        <span class="login-icon">🎵</span>

        Jayro Chords

      </div>


      <div class="login-subtitle">

        Sign in to access the chord library

      </div>


      <input
        id="emailInput"
        class="login-input"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >


      <input
        id="passwordInput"
        class="login-input"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >


      <button
        id="loginButton"
        class="login-button"
      >

        Login

      </button>


      <button
        id="requestButton"
        class="request-button"
      >

        Request Access

      </button>


      <div id="loginMessage"></div>

    </div>

  </section>



  <!-- =====================================================
       MAIN APP
       ===================================================== -->

  <section id="appPage">

    <div class="app-container">


      <h1 class="page-title">

        🎵 VCCF Peymous Songs List

      </h1>


      <div class="controls">

        <input
          id="searchInput"
          type="search"
          placeholder="Search song..."
          autocomplete="off"
        >


        <button
          id="logoutButton"
        >

          Logout

        </button>

      </div>


      <div id="songsContainer"></div>


      <div id="statusMessage">

        Loading songs...

      </div>


    </div>

  </section>



  <!-- =====================================================
       SONG MODAL
       ===================================================== -->

  <div id="songModal">

    <div class="modal-box">

      <div class="modal-header">

        <h2
          id="modalSongName"
          class="modal-title"
        >
        </h2>


        <button
          id="closeModal"
          class="close-button"
        >

          ×

        </button>

      </div>


      <div
        id="modalChords"
        class="chords"
      >
      </div>

    </div>

  </div>



  <script>


    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyDA81ZEdidhOJyUOlN8pIC4Y2zz0o07Wps",

      authDomain:
        "auth-543a0.firebaseapp.com",

      projectId:
        "auth-543a0",

      storageBucket:
        "auth-543a0.firebasestorage.app",

      messagingSenderId:
        "277890778144",

      appId:
        "1:277890778144:web:d1476a3e2c8aa61144e845",

      measurementId:
        "G-7TJHNT3J41"

    };


    // =====================================================
    // APPS SCRIPT WEB APP URL
    // =====================================================
    //
    // IMPORTANT:
    // Paste your CURRENT /exec URL here.
    //
    // It must look like:
    //
    // https://script.google.com/macros/s/XXXXXXXX/exec
    //
    // DO NOT use:
    // script.googleusercontent.com/macros/echo
    //
    // =====================================================

    const API_URL =
      https://script.google.com/macros/s/AKfycbzBa66P0S6V_UP_L7zutjkpad6B1LfETF87QEN8fWGK9Sg_52wAmUn5qdSH8A_25BGeNA/exec;


    // =====================================================
    // INITIALIZE FIREBASE
    // =====================================================

    firebase.initializeApp(
      firebaseConfig
    );


    const auth =
      firebase.auth();


    // =====================================================
    // ELEMENTS
    // =====================================================

    const loginPage =
      document.getElementById(
        "loginPage"
      );


    const appPage =
      document.getElementById(
        "appPage"
      );


    const emailInput =
      document.getElementById(
        "emailInput"
      );


    const passwordInput =
      document.getElementById(
        "passwordInput"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const requestButton =
      document.getElementById(
        "requestButton"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const songsContainer =
      document.getElementById(
        "songsContainer"
      );


    const statusMessage =
      document.getElementById(
        "statusMessage"
      );


    const songModal =
      document.getElementById(
        "songModal"
      );


    const modalSongName =
      document.getElementById(
        "modalSongName"
      );


    const modalChords =
      document.getElementById(
        "modalChords"
      );


    const closeModal =
      document.getElementById(
        "closeModal"
      );


    // =====================================================
    // SONG DATA
    // =====================================================

    let allSongs = [];


    // =====================================================
    // FIREBASE AUTH STATE
    // =====================================================

    auth.onAuthStateChanged(
      function(user) {

        if (user) {

          showApp();

        } else {

          showLogin();

        }

      }
    );


    // =====================================================
    // SHOW LOGIN
    // =====================================================

    function showLogin() {

      loginPage.style.display =
        "flex";

      appPage.style.display =
        "none";

    }


    // =====================================================
    // SHOW APP
    // =====================================================

    function showApp() {

      loginPage.style.display =
        "none";

      appPage.style.display =
        "block";


      loadSongs();

    }


    // =====================================================
    // LOGIN
    // =====================================================

    loginButton.addEventListener(
      "click",
      async function() {

        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;


        if (!email) {

          loginMessage.textContent =
            "Please enter your email.";

          return;

        }


        if (!password) {

          loginMessage.textContent =
            "Please enter your password.";

          return;

        }


        loginButton.disabled =
          true;


        loginButton.textContent =
          "Signing in...";


        loginMessage.textContent =
          "";


        try {

          await auth.signInWithEmailAndPassword(
            email,
            password
          );


          loginMessage.textContent =
            "";

        } catch (error) {

          console.error(
            error
          );


          loginMessage.textContent =
            getFirebaseErrorMessage(
              error
            );

        }


        loginButton.disabled =
          false;


        loginButton.textContent =
          "Login";

      }
    );


    // =====================================================
    // FIREBASE ERROR
    // =====================================================

    function getFirebaseErrorMessage(
      error
    ) {

      const code =
        error.code || "";


      switch (code) {

        case
          "auth/invalid-credential":

          return
            "Invalid email or password.";


        case
          "auth/invalid-login-credentials":

          return
            "Invalid email or password.";


        case
          "auth/user-not-found":

          return
            "No account was found with this email.";


        case
          "auth/wrong-password":

          return
            "Incorrect password.";


        case
          "auth/invalid-email":

          return
            "Please enter a valid email address.";


        case
          "auth/too-many-requests":

          return
            "Too many attempts. Please try again later.";


        case
          "auth/network-request-failed":

          return
            "Network error. Please check your connection.";


        default:

          return
            "Firebase error: " +
            (
              error.message ||
              "Unable to sign in."
            );

      }

    }


    // =====================================================
    // REQUEST ACCESS
    // =====================================================

    requestButton.addEventListener(
      "click",
      function() {

        const email =
          emailInput.value.trim();


        if (!email) {

          loginMessage.textContent =
            "Enter your email first, then click Request Access.";

          emailInput.focus();

          return;

        }


        loginMessage.textContent =
          "Access request received. Please contact the administrator to approve your account.";

      }
    );


    // =====================================================
    // LOGOUT
    // =====================================================

    logoutButton.addEventListener(
      "click",
      async function() {

        try {

          await auth.signOut();

        } catch (error) {

          console.error(
            error
          );

        }

      }
    );


    // =====================================================
    // LOAD SONGS
    // =====================================================

    async function loadSongs() {

      songsContainer.innerHTML =
        "";


      statusMessage.textContent =
        "Loading songs...";


      if (
        !API_URL ||
        API_URL ===
        "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE"
      ) {

        statusMessage.textContent =
          "Apps Script URL has not been configured.";

        return;

      }


      try {

        const response =
          await fetch(
            API_URL +
            "?t=" +
            Date.now()
          );


        if (!response.ok) {

          throw new Error(
            "Apps Script returned HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        console.log(
          "Apps Script response:",
          data
        );


        if (
          !Array.isArray(data)
        ) {

          throw new Error(
            "Apps Script did not return a song array."
          );

        }


        allSongs =
          data;


        displaySongs(
          allSongs
        );


      } catch (error) {

        console.error(
          "Song loading error:",
          error
        );


        songsContainer.innerHTML =
          "";


        statusMessage.textContent =
          "Unable to load songs. Please refresh the page.";

      }

    }


    // =====================================================
    // DISPLAY SONGS
    // =====================================================

    function displaySongs(
      songs
    ) {

      songsContainer.innerHTML =
        "";


      if (
        !songs ||
        songs.length === 0
      ) {

        statusMessage.textContent =
          "No songs found.";

        return;

      }


      statusMessage.textContent =
        "";


      songs.forEach(
        function(song) {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "song-card";


          const name =
            document.createElement(
              "div"
            );


          name.className =
            "song-name";


          name.textContent =
            song.name ||
            "Untitled Song";


          const preview =
            document.createElement(
              "div"
            );


          preview.className =
            "song-preview";


          preview.textContent =
            song.chords
              ? song.chords
              : "No chords available";


          card.appendChild(
            name
          );


          card.appendChild(
            preview
          );


          card.addEventListener(
            "click",
            function() {

              openSong(
                song
              );

            }
          );


          songsContainer.appendChild(
            card
          );

        }
      );

    }


    // =====================================================
    // SEARCH
    // =====================================================

    searchInput.addEventListener(
      "input",
      function() {

        const search =
          searchInput.value
            .trim()
            .toLowerCase();


        if (!search) {

          displaySongs(
            allSongs
          );

          return;

        }


        const filtered =
          allSongs.filter(
            function(song) {

              const name =
                String(
                  song.name || ""
                )
                .toLowerCase();


              return name.includes(
                search
              );

            }
          );


        displaySongs(
          filtered
        );

      }
    );


    // =====================================================
    // OPEN SONG
    // =====================================================

    function openSong(
      song
    ) {

      modalSongName.textContent =
        song.name ||
        "Untitled Song";


      modalChords.textContent =
        song.chords ||
        "No chords available.";


      songModal.style.display =
        "block";


      document.body.style.overflow =
        "hidden";

    }


    // =====================================================
    // CLOSE SONG
    // =====================================================

    function closeSongModal() {

      songModal.style.display =
        "none";


      document.body.style.overflow =
        "";

    }


    closeModal.addEventListener(
      "click",
      closeSongModal
    );


    songModal.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          songModal
        ) {

          closeSongModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Escape"
        ) {

          closeSongModal();

        }

      }
    );


  </script>

</body>

</html>
