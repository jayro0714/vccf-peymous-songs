<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Jayro Chords</title>


  <style>

    /* =====================================================
       GLOBAL
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }


    /* =====================================================
       HOME PAGE
    ===================================================== */

    #homePage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }


    header {
      text-align: center;
      padding: 30px 15px 20px;
    }


    header h1 {
      margin: 0 0 20px;
      font-size: 32px;
    }


    #search {
      width: 90%;
      max-width: 500px;
      padding: 14px 16px;

      background: white;
      color: #111827;

      border: none;
      border-radius: 10px;

      outline: none;

      font-size: 16px;
    }


    #search::placeholder {
      color: #64748b;
    }


    #songs {
      width: 90%;
      max-width: 700px;

      margin: 10px auto 40px;

      flex: 1;
    }


    .song {
      background: #1e293b;

      padding: 17px;

      margin-bottom: 10px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: bold;

      transition: 0.2s;
    }


    .song:hover {
      background: #334155;
      transform: translateY(-1px);
    }


    #message {
      text-align: center;

      color: #94a3b8;

      margin: 30px;
    }



    /* =====================================================
       SONG PAGE
    ===================================================== */

    #songPage {
      display: none;

      width: 90%;
      max-width: 800px;

      margin: 30px auto 0;

      min-height: calc(100vh - 30px);
    }



    /* =====================================================
       SONG NAVIGATION
    ===================================================== */

    .song-navigation {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 20px;

      flex-wrap: wrap;
    }


    .back {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      padding: 11px 15px;

      background: #1e293b;

      color: #60a5fa;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

      white-space: nowrap;

      transition: 0.2s;
    }


    .back:hover {

      background: #334155;

      color: #93c5fd;
    }



    /* =====================================================
       SEARCH ANOTHER SONG
    ===================================================== */

    .song-search-container {

      position: relative;

      width: 240px;

      flex: none;
    }


    #songSearch {

      width: 240px;

      padding: 10px 14px;

      background: white;

      color: #111827;

      border: none;

      border-radius: 8px;

      outline: none;

      font-size: 14px;
    }


    #songSearch::placeholder {

      color: #64748b;
    }


    #songSearch:focus {

      border: none;

      outline: none;
    }



    /* =====================================================
       SEARCH RESULTS
    ===================================================== */

    #songSearchResults {

      position: absolute;

      top: calc(100% + 6px);

      left: 0;

      width: 240px;

      z-index: 1000;

      background: #1e293b;

      border: 1px solid #334155;

      border-radius: 8px;

      overflow: hidden;

      display: none;

      max-height: 300px;

      overflow-y: auto;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }


    .song-search-result {

      padding: 12px 14px;

      cursor: pointer;

      border-bottom: 1px solid #334155;

      font-size: 14px;

      color: white;
    }


    .song-search-result:last-child {

      border-bottom: none;
    }


    .song-search-result:hover {

      background: #334155;
    }


    .song-search-no-results {

      padding: 12px 14px;

      color: #94a3b8;

      font-size: 14px;
    }



    /* =====================================================
       SONG TITLE
    ===================================================== */

    #songTitle {

      font-size: 34px;

      margin: 0 0 20px;
    }



    /* =====================================================
       TRANSPOSE
    ===================================================== */

    .transpose {

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 15px;

      padding: 15px;

      margin-bottom: 20px;

      background: #1e293b;

      border-radius: 10px;
    }


    .transpose span {

      font-weight: bold;
    }


    .transpose button {

      width: 45px;

      height: 40px;

      border: none;

      border-radius: 8px;

      background: #334155;

      color: white;

      font-size: 22px;

      font-weight: bold;

      cursor: pointer;
    }


    .transpose button:hover {

      background: #475569;
    }


    #keyDisplay {

      min-width: 80px;

      text-align: center;

      font-weight: bold;
    }



    /* =====================================================
       CHORDS
    ===================================================== */

    #chords {

      background: #111827;

      padding: 25px;

      border-radius: 10px;

      white-space: pre-wrap;

      font-family: "Courier New", monospace;

      font-size: 18px;

      line-height: 1.7;

      overflow-x: auto;
    }



    /* =====================================================
       FOOTER
    ===================================================== */

    .site-footer {

      margin-top: 50px;

      padding: 30px 20px;

      text-align: center;

      border-top: 1px solid #334155;

      color: #94a3b8;
    }


    .footer-brand {

      font-size: 18px;

      font-weight: bold;

      color: white;

      margin-bottom: 8px;

      letter-spacing: 0.3px;
    }


    .footer-copyright {

      font-size: 13px;

      color: #64748b;
    }



    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      header h1 {

        font-size: 25px;
      }


      #songTitle {

        font-size: 28px;
      }


      .song-navigation {

        align-items: stretch;

        flex-direction: column;
      }


      .back {

        width: 100%;
      }


      .song-search-container {

        width: 100%;
      }


      #songSearch {

        width: 100%;
      }


      #songSearchResults {

        width: 100%;
      }


      .transpose {

        gap: 10px;
      }


      .transpose button {

        width: 42px;

        height: 38px;
      }


      #chords {

        font-size: 16px;

        padding: 18px;
      }


      .site-footer {

        margin-top: 40px;

        padding: 25px 15px;
      }


      .footer-brand {

        font-size: 16px;
      }


      .footer-copyright {

        font-size: 12px;
      }

    }

  </style>

</head>



<body>


  <!-- =====================================================
       HOME PAGE
  ===================================================== -->

  <div id="homePage">


    <header>

      <h1>
        🎵 VCCF Peymous Songs List
      </h1>


      <input
        id="search"
        type="text"
        placeholder="Search song..."
        autocomplete="off"
      >

    </header>


    <div id="songs"></div>


    <div id="message">
      Loading songs...
    </div>


  </div>



  <!-- =====================================================
       SONG PAGE
  ===================================================== -->

  <div id="songPage">


    <!-- NAVIGATION -->

    <div class="song-navigation">


      <div
        class="back"
        onclick="showHome()"
      >
        ← Back to Songs
      </div>


      <div class="song-search-container">


        <input
          id="songSearch"
          type="text"
          placeholder="Search another song..."
          autocomplete="off"
        >


        <div id="songSearchResults"></div>


      </div>


    </div>



    <!-- SONG TITLE -->

    <h1 id="songTitle"></h1>



    <!-- TRANSPOSE -->

    <div class="transpose">


      <span>
        Transpose
      </span>


      <button
        onclick="transposeDown()"
        title="Transpose down"
      >
        −
      </button>


      <div id="keyDisplay">
        Key: -
      </div>


      <button
        onclick="transposeUp()"
        title="Transpose up"
      >
        +
      </button>


    </div>



    <!-- CHORDS -->

    <div id="chords"></div>



    <!-- FOOTER -->

    <footer class="site-footer">


      <div class="footer-brand">
        🎵 jayrochords.com
      </div>


      <div class="footer-copyright">
        © 2026 Jayro
      </div>


    </footer>


  </div>



<script>


  // =====================================================
  // GOOGLE APPS SCRIPT URL
  // =====================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyAbVFUV4zRmG9luRmr4sNeBB1H7OJZpIu5bghyfbZtvLaPr2sEm5Jo5W0qI8HkUdy9HQ/exec";



  // =====================================================
  // VARIABLES
  // =====================================================

  let songs = [];

  let currentSong = null;

  let transposeAmount = 0;



  // =====================================================
  // PREFERRED CHORD SPELLING
  //
  // Ab -> G#
  // A# -> Bb
  // =====================================================

  const chromaticNotes = [

    "C",

    "C#",

    "D",

    "Eb",

    "E",

    "F",

    "F#",

    "G",

    "G#",

    "A",

    "Bb",

    "B"

  ];



  // =====================================================
  // NOTE TO NUMBER
  // =====================================================

  function noteToNumber(note) {

    const map = {

      "C": 0,
      "B#": 0,

      "C#": 1,
      "Db": 1,

      "D": 2,

      "D#": 3,
      "Eb": 3,

      "E": 4,
      "Fb": 4,

      "F": 5,
      "E#": 5,

      "F#": 6,
      "Gb": 6,

      "G": 7,

      "G#": 8,
      "Ab": 8,

      "A": 9,

      "A#": 10,
      "Bb": 10,

      "B": 11,
      "Cb": 11

    };


    return map[note];

  }



  // =====================================================
  // TRANSPOSE ONE NOTE
  // =====================================================

  function transposeNote(
    note,
    amount
  ) {

    const number =
      noteToNumber(note);


    if (
      number === undefined
    ) {

      return note;

    }


    let newNumber =
      (
        number +
        amount
      ) % 12;


    if (
      newNumber < 0
    ) {

      newNumber += 12;

    }


    return chromaticNotes[
      newNumber
    ];

  }



  // =====================================================
  // TRANSPOSE CHORDS
  //
  // Supports:
  //
  // C
  // Cm
  // C7
  // Cmaj7
  // Csus4
  //
  // Slash chords:
  //
  // C/F
  // C#/F#m
  // Eb/F#
  // D/F#
  // Cm/Bb
  // F#m/C#
  //
  // Parentheses are supported.
  // =====================================================

  function transposeChords(
    text,
    amount
  ) {

    if (
      !text ||
      amount === 0
    ) {

      return text;

    }


    let result = text;



    // =================================================
    // TRANSPOSE MAIN CHORD ROOTS
    // =================================================

    const rootRegex =
      /(^|[\s(\[\{,;:\-])([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|\+|-|[0-9]|\/|[\s)\]\},;:.]|$))/g;


    result =
      result.replace(
        rootRegex,
        function(
          fullMatch,
          separator,
          root
        ) {

          return (
            separator +
            transposeNote(
              root,
              amount
            )
          );

        }
      );



    // =================================================
    // TRANSPOSE SLASH-CHORD BASS NOTES
    //
    // This handles:
    //
    // /F#
    // /F#m
    // /Bb
    // /Bbm
    // /C#
    // /C#m
    // =================================================

    const bassRegex =
      /\/([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|\+|-|[0-9]|[\s)\]\},;:.]|$))/g;


    result =
      result.replace(
        bassRegex,
        function(
          fullMatch,
          bassNote
        ) {

          return (
            "/" +
            transposeNote(
              bassNote,
              amount
            )
          );

        }
      );


    return result;

  }



  // =====================================================
  // GET ORIGINAL KEY
  // =====================================================

  function getOriginalKey(text) {

    if (!text) {

      return "-";

    }


    const keyAtStart =
      text.match(
        /^\s*\(?([A-G](?:#|b)?)\)?/
      );


    if (keyAtStart) {

      return keyAtStart[1];

    }


    const firstChord =
      text.match(
        /(?:^|[\s(\[])([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|[0-9]|\/|[\s)\],;:.]|$))/
      );


    if (!firstChord) {

      return "-";

    }


    return firstChord[1];

  }



  // =====================================================
  // GET DISPLAYED KEY
  // =====================================================

  function getDisplayedKey(
    text,
    amount
  ) {

    const originalKey =
      getOriginalKey(text);


    const number =
      noteToNumber(
        originalKey
      );


    if (
      number === undefined
    ) {

      return "-";

    }


    let newNumber =
      (
        number +
        amount
      ) % 12;


    if (
      newNumber < 0
    ) {

      newNumber += 12;

    }


    return chromaticNotes[
      newNumber
    ];

  }



  // =====================================================
  // LOAD SONGS
  // =====================================================

  function loadSongs() {

    const callbackName =
      "receiveSongs_" +
      Date.now();


    window[callbackName] =
      function(data) {

        songs =
          Array.isArray(data)
            ? data
            : [];


        // Alphabetical order

        songs.sort(
          function(a, b) {

            return String(
              a.name || ""
            ).localeCompare(
              String(
                b.name || ""
              ),
              undefined,
              {
                sensitivity: "base"
              }
            );

          }
        );


        delete window[
          callbackName
        ];


        const oldScript =
          document.getElementById(
            "songsApiScript"
          );


        if (oldScript) {

          oldScript.remove();

        }


        displaySongs(
          songs
        );

      };


    const script =
      document.createElement(
        "script"
      );


    script.id =
      "songsApiScript";


    script.src =
      API_URL +
      "?callback=" +
      encodeURIComponent(
        callbackName
      );


    script.onerror =
      function() {

        document
          .getElementById(
            "message"
          )
          .textContent =
          "Unable to load songs. Please try again.";


        delete window[
          callbackName
        ];


        script.remove();

      };


    document
      .body
      .appendChild(
        script
      );

  }



  // =====================================================
  // DISPLAY HOME SONGS
  // =====================================================

  function displaySongs(
    list
  ) {

    const container =
      document.getElementById(
        "songs"
      );


    const message =
      document.getElementById(
        "message"
      );


    container.innerHTML =
      "";


    if (
      !list ||
      list.length === 0
    ) {

      message.textContent =
        "No songs found.";

      return;

    }


    message.textContent =
      "";


    list.forEach(
      function(song) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "song";


        div.textContent =
          song.name;


        div.onclick =
          function() {

            openSong(
              song
            );

          };


        container.appendChild(
          div
        );

      }
    );

  }



  // =====================================================
  // HOME SEARCH
  // =====================================================

  document
    .getElementById(
      "search"
    )
    .addEventListener(
      "input",
      function() {

        const searchText =
          this.value
            .trim()
            .toLowerCase();


        if (!searchText) {

          displaySongs(
            songs
          );

          return;

        }


        const filtered =
          songs.filter(
            function(song) {

              return String(
                song.name || ""
              )
              .toLowerCase()
              .includes(
                searchText
              );

            }
          );


        displaySongs(
          filtered
        );

      }
    );



  // =====================================================
  // SEARCH ANOTHER SONG
  // =====================================================

  const songSearch =
    document.getElementById(
      "songSearch"
    );


  const songSearchResults =
    document.getElementById(
      "songSearchResults"
    );



  songSearch.addEventListener(
    "input",
    function() {

      const searchText =
        this.value
          .trim()
          .toLowerCase();


      if (!searchText) {

        songSearchResults.style.display =
          "none";

        songSearchResults.innerHTML =
          "";

        return;

      }


      const matches =
        songs.filter(
          function(song) {

            return String(
              song.name || ""
            )
            .toLowerCase()
            .includes(
              searchText
            );

          }
        );


      songSearchResults.innerHTML =
        "";


      if (
        matches.length === 0
      ) {

        const noResults =
          document.createElement(
            "div"
          );


        noResults.className =
          "song-search-no-results";


        noResults.textContent =
          "No songs found.";


        songSearchResults.appendChild(
          noResults
        );


        songSearchResults.style.display =
          "block";


        return;

      }


      matches
        .slice(0, 15)
        .forEach(
          function(song) {

            const result =
              document.createElement(
                "div"
              );


            result.className =
              "song-search-result";


            result.textContent =
              song.name;


            result.onclick =
              function() {

                openSongFromSearch(
                  song
                );

              };


            songSearchResults.appendChild(
              result
            );

          }
        );


      songSearchResults.style.display =
        "block";

    }
  );



  // =====================================================
  // OPEN SONG FROM SEARCH
  // =====================================================

  function openSongFromSearch(
    song
  ) {

    songSearch.value =
      "";


    songSearchResults.innerHTML =
      "";


    songSearchResults.style.display =
      "none";


    openSong(
      song
    );

  }



  // =====================================================
  // CLOSE SEARCH WHEN CLICKING OUTSIDE
  // =====================================================

  document.addEventListener(
    "click",
    function(event) {

      const container =
        document.querySelector(
          ".song-search-container"
        );


      if (
        container &&
        !container.contains(
          event.target
        )
      ) {

        songSearchResults.style.display =
          "none";

      }

    }
  );



  // =====================================================
  // OPEN SONG
  // =====================================================

  function openSong(
    song
  ) {

    currentSong =
      song;


    transposeAmount =
      0;


    document
      .getElementById(
        "homePage"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "songPage"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "songTitle"
      )
      .textContent =
      song.name;


    songSearch.value =
      "";


    songSearchResults.innerHTML =
      "";


    songSearchResults.style.display =
      "none";


    updateSong();


    window.scrollTo(
      0,
      0
    );

  }



  // =====================================================
  // SHOW HOME
  // =====================================================

  function showHome() {

    currentSong =
      null;


    transposeAmount =
      0;


    songSearch.value =
      "";


    songSearchResults.innerHTML =
      "";


    songSearchResults.style.display =
      "none";


    document
      .getElementById(
        "songPage"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "homePage"
      )
      .style.display =
      "flex";


    window.scrollTo(
      0,
      0
    );

  }



  // =====================================================
  // TRANSPOSE UP
  // =====================================================

  function transposeUp() {

    if (!currentSong) {

      return;

    }


    transposeAmount++;


    updateSong();

  }



  // =====================================================
  // TRANSPOSE DOWN
  // =====================================================

  function transposeDown() {

    if (!currentSong) {

      return;

    }


    transposeAmount--;


    updateSong();

  }



  // =====================================================
  // UPDATE SONG
  // =====================================================

  function updateSong() {

    if (!currentSong) {

      return;

    }


    const original =
      String(
        currentSong.chords || ""
      );


    const transposed =
      transposeChords(
        original,
        transposeAmount
      );


    document
      .getElementById(
        "chords"
      )
      .textContent =
      transposed;


    document
      .getElementById(
        "keyDisplay"
      )
      .textContent =
      "Key: " +
      getDisplayedKey(
        original,
        transposeAmount
      );

  }



  // =====================================================
  // START APP
  // =====================================================

  loadSongs();

</script>


</body>

</html>
