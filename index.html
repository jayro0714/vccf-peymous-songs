<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Jayro Chords</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }


    /* =====================================================
       LOGIN
    ===================================================== */

    #loginPage {
      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;

      background: #1e293b;

      padding: 30px;

      border-radius: 14px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.3);

      text-align: center;
    }

    .login-box h1 {
      margin: 0 0 8px;

      font-size: 30px;
    }

    .login-subtitle {
      color: #94a3b8;

      font-size: 14px;

      margin-bottom: 25px;
    }

    .login-input {
      width: 100%;

      padding: 13px 14px;

      margin-bottom: 12px;

      background: white;

      color: #111827;

      border: none;

      border-radius: 8px;

      outline: none;

      font-size: 15px;
    }

    .login-input::placeholder {
      color: #64748b;
    }

    .login-button {
      width: 100%;

      padding: 13px;

      margin-top: 5px;

      border: none;

      border-radius: 8px;

      background: #2563eb;

      color: white;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;
    }

    .login-button:hover {
      background: #1d4ed8;
    }

    .login-button:disabled {
      opacity: 0.7;

      cursor: not-allowed;
    }

    .request-button {
      width: 100%;

      padding: 12px;

      margin-top: 10px;

      border: 1px solid #475569;

      border-radius: 8px;

      background: transparent;

      color: #60a5fa;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;
    }

    .request-button:hover {
      background: #334155;
    }

    .login-message {
      margin-top: 15px;

      font-size: 14px;

      color: #94a3b8;

      min-height: 20px;
    }


    /* =====================================================
       REQUEST ACCESS
    ===================================================== */

    #requestPage {
      display: none;

      min-height: 100vh;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .request-box {
      width: 100%;

      max-width: 450px;

      background: #1e293b;

      padding: 30px;

      border-radius: 14px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .request-box h1 {
      margin: 0 0 8px;

      text-align: center;

      font-size: 28px;
    }

    .request-subtitle {
      text-align: center;

      color: #94a3b8;

      font-size: 14px;

      margin-bottom: 25px;
    }

    .request-label {
      display: block;

      margin-bottom: 6px;

      font-size: 14px;

      font-weight: bold;
    }

    .request-input,
    .request-textarea {
      width: 100%;

      padding: 13px 14px;

      margin-bottom: 15px;

      background: white;

      color: #111827;

      border: none;

      border-radius: 8px;

      outline: none;

      font-size: 15px;

      font-family: Arial, sans-serif;
    }

    .request-textarea {
      min-height: 100px;

      resize: vertical;
    }

    .submit-request {
      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 8px;

      background: #2563eb;

      color: white;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;
    }

    .back-login {
      display: block;

      text-align: center;

      margin-top: 15px;

      color: #60a5fa;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;
    }


    /* =====================================================
       HOME
    ===================================================== */

    #homePage {
      min-height: 100vh;

      display: none;

      flex-direction: column;
    }

    header {
      text-align: center;

      padding: 30px 15px 20px;
    }

    header h1 {
      margin: 0 0 20px;

      font-size: 32px;
    }

    #search {
      width: 90%;

      max-width: 500px;

      padding: 14px 16px;

      background: white;

      color: #111827;

      border: none;

      border-radius: 10px;

      outline: none;

      font-size: 16px;
    }

    #search::placeholder {
      color: #64748b;
    }

    .home-toolbar {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;
    }

    #songs {
      width: 90%;

      max-width: 700px;

      margin: 10px auto 40px;

      flex: 1;
    }

    .song {
      background: #1e293b;

      padding: 17px;

      margin-bottom: 10px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: bold;

      transition: 0.2s;
    }

    .song:hover {
      background: #334155;

      transform: translateY(-1px);
    }

    #message {
      text-align: center;

      color: #94a3b8;

      margin: 30px;
    }

    .logout-button {
      padding: 12px 18px;

      border: 1px solid #475569;

      border-radius: 8px;

      background: transparent;

      color: #60a5fa;

      font-weight: bold;

      cursor: pointer;
    }

    .logout-button:hover {
      background: #334155;
    }


    /* =====================================================
       SONG PAGE
    ===================================================== */

    #songPage {
      display: none;

      width: 90%;

      max-width: 800px;

      margin: 30px auto 0;

      min-height: calc(100vh - 30px);
    }

    .song-navigation {
      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 20px;

      flex-wrap: wrap;
    }

    .back {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 11px 15px;

      background: #1e293b;

      color: #60a5fa;

      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;

      white-space: nowrap;
    }

    .back:hover {
      background: #334155;

      color: #93c5fd;
    }


    /* =====================================================
       SONG SEARCH
    ===================================================== */

    .song-search-container {
      position: relative;

      width: 240px;

      flex: none;
    }

    #songSearch {
      width: 240px;

      padding: 10px 14px;

      background: white;

      color: #111827;

      border: none;

      border-radius: 8px;

      outline: none;

      font-size: 14px;
    }

    #songSearchResults {
      position: absolute;

      top: calc(100% + 6px);

      left: 0;

      width: 240px;

      z-index: 1000;

      background: #1e293b;

      border: 1px solid #334155;

      border-radius: 8px;

      overflow: hidden;

      display: none;

      max-height: 300px;

      overflow-y: auto;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .song-search-result {
      padding: 12px 14px;

      cursor: pointer;

      border-bottom: 1px solid #334155;

      font-size: 14px;

      color: white;
    }

    .song-search-result:hover {
      background: #334155;
    }

    .song-search-no-results {
      padding: 12px 14px;

      color: #94a3b8;

      font-size: 14px;
    }


    /* =====================================================
       SONG TITLE
    ===================================================== */

    #songTitle {
      font-size: 34px;

      margin: 0 0 20px;
    }


    /* =====================================================
       TRANSPOSE
    ===================================================== */

    .transpose {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 15px;

      padding: 15px;

      margin-bottom: 20px;

      background: #1e293b;

      border-radius: 10px;
    }

    .transpose span {
      font-weight: bold;
    }

    .transpose button {
      width: 45px;

      height: 40px;

      border: none;

      border-radius: 8px;

      background: #334155;

      color: white;

      font-size: 22px;

      font-weight: bold;

      cursor: pointer;
    }

    .transpose button:hover {
      background: #475569;
    }

    #keyDisplay {
      min-width: 80px;

      text-align: center;

      font-weight: bold;
    }


    /* =====================================================
       CHORDS
    ===================================================== */

    #chords {
      background: #111827;

      padding: 25px;

      border-radius: 10px;

      white-space: pre-wrap;

      font-family: "Courier New", monospace;

      font-size: 18px;

      line-height: 1.7;

      overflow-x: auto;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .site-footer {
      margin-top: 50px;

      padding: 30px 20px;

      text-align: center;

      border-top: 1px solid #334155;

      color: #94a3b8;
    }

    .footer-brand {
      font-size: 18px;

      font-weight: bold;

      color: white;

      margin-bottom: 8px;
    }

    .footer-copyright {
      font-size: 13px;

      color: #64748b;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      header h1 {
        font-size: 25px;
      }

      #songTitle {
        font-size: 28px;
      }

      .song-navigation {
        flex-direction: column;

        align-items: stretch;
      }

      .back {
        width: 100%;
      }

      .song-search-container {
        width: 100%;
      }

      #songSearch {
        width: 100%;
      }

      #songSearchResults {
        width: 100%;
      }

      #chords {
        font-size: 16px;

        padding: 18px;
      }

      .site-footer {
        margin-top: 40px;

        padding: 25px 15px;
      }
    }

  </style>

</head>


<body>


  <!-- =====================================================
       LOGIN PAGE
  ===================================================== -->

  <div id="loginPage">

    <div class="login-box">

      <h1>
        🎵 Jayro Chords
      </h1>

      <div class="login-subtitle">
        Sign in to access the chord library
      </div>

      <input
        id="loginEmail"
        class="login-input"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        class="login-input"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        class="login-button"
        type="button"
      >
        Login
      </button>

      <button
        class="request-button"
        type="button"
        onclick="showRequestPage()"
      >
        Request Access
      </button>

      <div
        id="loginMessage"
        class="login-message"
      ></div>

    </div>

  </div>



  <!-- =====================================================
       REQUEST ACCESS PAGE
  ===================================================== -->

  <div id="requestPage">

    <div class="request-box">

      <h1>
        Request Access
      </h1>

      <div class="request-subtitle">
        Request access to the Jayro Chords library.
      </div>

      <label
        class="request-label"
        for="requestName"
      >
        Name
      </label>

      <input
        id="requestName"
        class="request-input"
        type="text"
        placeholder="Your name"
      >

      <label
        class="request-label"
        for="requestEmail"
      >
        Email
      </label>

      <input
        id="requestEmail"
        class="request-input"
        type="email"
        placeholder="you@example.com"
      >

      <label class="request-label" for="requestPassword">Password</label>

      <input

      <div
        id="requestMessage"
        class="login-message"
      ></div>

      <div
        class="back-login"
        onclick="showLoginPage()"
      >
        ← Back to Login
      </div>

    </div>

  </div>



  <!-- =====================================================
       HOME PAGE
  ===================================================== -->

  <div id="homePage">

    <header>

      <h1>
        🎵 VCCF Peymous Songs List
      </h1>

      <div class="home-toolbar">

        <input
          id="search"
          type="text"
          placeholder="Search song..."
          autocomplete="off"
        >

        <button
          id="logoutButton"
          class="logout-button"
          type="button"
        >
          Logout
        </button>

      </div>

    </header>


    <div id="songs"></div>

    <div id="message">
      Loading songs...
    </div>

  </div>



  <!-- =====================================================
       SONG PAGE
  ===================================================== -->

  <div id="songPage">

    <div class="song-navigation">

      <div
        class="back"
        onclick="showHome()"
      >
        ← Back to Songs
      </div>


      <div class="song-search-container">

        <input
          id="songSearch"
          type="text"
          placeholder="Search another song..."
          autocomplete="off"
        >

        <div id="songSearchResults"></div>

      </div>

    </div>


    <h1 id="songTitle"></h1>


    <div class="transpose">

      <span>
        Transpose
      </span>

      <button
        type="button"
        onclick="transposeDown()"
      >
        −
      </button>

      <div id="keyDisplay">
        Key: -
      </div>

      <button
        type="button"
        onclick="transposeUp()"
      >
        +
      </button>

    </div>


    <div id="chords"></div>


    <footer class="site-footer">

      <div class="footer-brand">
        🎵 jayrochords.com
      </div>

      <div class="footer-copyright">
        © 2026 Jayro
      </div>

    </footer>

  </div>



  <script>

    /* =====================================================
       GOOGLE APPS SCRIPT
    ===================================================== */

    const API_URL =
  "https://script.google.com/macros/s/AKfycbzBa66P0S6V_UP_L7zutjkpad6B1LfETF87QEN8fWGK9Sg_52wAmUn5qdSH8A_25BGeNA/exec";


    /* =====================================================
       VARIABLES
    ===================================================== */

    let songs = [];

    let currentSong = null;

    let transposeAmount = 0;

    let loginInProgress = false;


    /* =====================================================
       CHROMATIC NOTES
    ===================================================== */

    const chromaticNotes = [

      "C",
      "C#",
      "D",
      "Eb",
      "E",
      "F",
      "F#",
      "G",
      "G#",
      "A",
      "Bb",
      "B"

    ];


    /* =====================================================
       NOTE → NUMBER
    ===================================================== */

    function noteToNumber(note) {

      const map = {

        "C": 0,
        "B#": 0,

        "C#": 1,
        "Db": 1,

        "D": 2,

        "D#": 3,
        "Eb": 3,

        "E": 4,
        "Fb": 4,

        "F": 5,
        "E#": 5,

        "F#": 6,
        "Gb": 6,

        "G": 7,

        "G#": 8,
        "Ab": 8,

        "A": 9,

        "A#": 10,
        "Bb": 10,

        "B": 11,
        "Cb": 11

      };

      return map[note];

    }


    /* =====================================================
       TRANSPOSE NOTE
    ===================================================== */

    function transposeNote(
      note,
      amount
    ) {

      const number =
        noteToNumber(note);


      if (
        number === undefined
      ) {

        return note;

      }


      let newNumber =
        (
          number +
          amount
        ) % 12;


      if (
        newNumber < 0
      ) {

        newNumber += 12;

      }


      return chromaticNotes[
        newNumber
      ];

    }


    /* =====================================================
       TRANSPOSE CHORDS
    ===================================================== */

    function transposeChords(
      text,
      amount
    ) {

      if (
        !text ||
        amount === 0
      ) {

        return text;

      }


      let result =
        text;


      /*
        First transpose chord roots.
      */

      const rootRegex =
        /(^|[\s(\[\{,;:\-])([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|\+|-|[0-9]|\/|[\s)\]\},;:.]|$))/g;


      result =
        result.replace(
          rootRegex,
          function(
            fullMatch,
            separator,
            root
          ) {

            return (
              separator +
              transposeNote(
                root,
                amount
              )
            );

          }
        );


      /*
        Then transpose slash-chord
        bass notes.
      */

      const bassRegex =
        /\/([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|\+|-|[0-9]|[\s)\]\},;:.]|$))/g;


      result =
        result.replace(
          bassRegex,
          function(
            fullMatch,
            bassNote
          ) {

            return (
              "/" +
              transposeNote(
                bassNote,
                amount
              )
            );

          }
        );


      return result;

    }


    /* =====================================================
       ORIGINAL KEY
    ===================================================== */

   function getOriginalKey(text) {
  if (!text) {
    return "-";
  }

  // Above All is originally in G
  if (
    currentSong &&
    String(currentSong.name).trim().toLowerCase() === "above all"
  ) {
    return "G";
  }

  // Look for an explicit Key declaration
  const keyMatch = text.match(
    /(?:^|\n|\r)\s*(?:Key\s*[:=]\s*|\()\s*([A-G](?:#|b)?)\s*\)?/i
  );

  if (keyMatch) {
    return keyMatch[1];
  }

  return "-";
}


    /* =====================================================
       SHOW LOGIN
    ===================================================== */

    function showLoginPage() {

      document
        .getElementById(
          "loginPage"
        )
        .style.display =
        "flex";


      document
        .getElementById(
          "requestPage"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "homePage"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "songPage"
        )
        .style.display =
        "none";

    }


    /* =====================================================
       SHOW REQUEST PAGE
    ===================================================== */

    function showRequestPage() {

      document
        .getElementById(
          "loginPage"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "requestPage"
        )
        .style.display =
        "flex";


      document
        .getElementById(
          "requestMessage"
        )
        .textContent =
        "";

      document.getElementById("requestPassword").value = "";

    }


    /* =====================================================
       SHOW HOME
    ===================================================== */

    function showHome() {

      /*
        Do NOT require currentUser here.

        This is important because Firebase can
        take a moment to update currentUser during
        the sign-in operation.
      */

      document
        .getElementById(
          "loginPage"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "requestPage"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "songPage"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "homePage"
        )
        .style.display =
        "flex";


      currentSong =
        null;


      transposeAmount =
        0;


      document
        .getElementById(
          "songSearch"
        )
        .value =
        "";


      document
        .getElementById(
          "songSearchResults"
        )
        .style.display =
        "none";


      window.scrollTo(
        0,
        0
      );

    }


    /* =====================================================
       LOGIN
    ===================================================== */
    function login() {
      const emailInput = document.getElementById("loginEmail");
      const passwordInput = document.getElementById("loginPassword");
      const button = document.getElementById("loginButton");
      const message = document.getElementById("loginMessage");

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email) {
        message.textContent = "Please enter your email.";
        return;
      }

      if (!password) {
        message.textContent = "Please enter your password.";
        return;
      }

      if (loginInProgress) return;

      loginInProgress = true;
      button.disabled = true;
      button.textContent = "Signing in...";
      message.textContent = "Signing in...";

      const callbackName = "loginResponse_" + Date.now();
      const script = document.createElement("script");
      let finished = false;

      function cleanup() {
        if (finished) return;
        finished = true;
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        loginInProgress = false;
        button.disabled = false;
        button.textContent = "Login";
      }

      window[callbackName] = function(result) {
        try {
          console.log("Login response:", result);

          if (!result || result.success !== true) {
            message.textContent =
              (result && result.message) || "Unable to log in.";
            return;
          }

          // IMPORTANT: use localStorage because loadSongs(), logout(),
          // and session restore all use the same storage.
          localStorage.setItem("jayro_token", result.token);
          localStorage.setItem("jayro_email", result.email || email);
          localStorage.setItem("jayro_name", result.name || "");
          localStorage.setItem("jayro_role", result.role || "User");

          message.textContent = "";
          showHome();
          loadSongs();
        } finally {
          cleanup();
        }
      };

      script.onerror = function() {
        console.error("Login request failed.");
        message.textContent = "Unable to connect to the server.";
        cleanup();
      };

      // Apps Script does not provide the CORS headers needed for a
      // cross-origin fetch() from GitHub Pages. JSONP through doGet()
      // avoids that browser CORS problem.
      script.src =
        API_URL +
        "?action=login" +
        "&email=" + encodeURIComponent(email) +
        "&password=" + encodeURIComponent(password) +
        "&callback=" + encodeURIComponent(callbackName);

      document.body.appendChild(script);
    }


    /* =====================================================
       LOGOUT
    ===================================================== */
    async function logout() {
      const token = localStorage.getItem("jayro_token");
      try {
        if (token) {
          await new Promise(function(resolve) {
            const callbackName = "logoutResponse_" + Date.now();
            const script = document.createElement("script");
            window[callbackName] = function() {
              delete window[callbackName];
              if (script.parentNode) script.parentNode.removeChild(script);
              resolve();
            };
            script.src = API_URL + "?action=logout" + "&token=" + encodeURIComponent(token) + "&callback=" + encodeURIComponent(callbackName);
            script.onerror = function() {
              delete window[callbackName];
              if (script.parentNode) script.parentNode.removeChild(script);
              resolve();
            };
            document.body.appendChild(script);
          });
        }
      } catch (error) { console.error("Logout error:", error); }
      localStorage.removeItem("jayro_token"); localStorage.removeItem("jayro_email"); localStorage.removeItem("jayro_name"); localStorage.removeItem("jayro_role");
      songs = []; currentSong = null; transposeAmount = 0;
      document.getElementById("songs").innerHTML = "";
      document.getElementById("loginEmail").value = "";
      document.getElementById("loginPassword").value = "";
      document.getElementById("loginMessage").textContent = "";
      showLoginPage();
    }


    /* =====================================================
       LOAD SONGS
    ===================================================== */
    function loadSongs() {
      return new Promise(function(resolve) {
        const token = localStorage.getItem("jayro_token");
        if (!token) { document.getElementById("message").textContent = "Please log in first."; showLoginPage(); resolve(false); return; }
        const callbackName = "receiveSongs_" + Date.now();
        const script = document.createElement("script");
        window[callbackName] = function(data) {
          try {
            if (data && data.success === false) {
              localStorage.removeItem("jayro_token"); localStorage.removeItem("jayro_email"); localStorage.removeItem("jayro_name"); localStorage.removeItem("jayro_role");
              songs = []; document.getElementById("songs").innerHTML = "";
              document.getElementById("message").textContent = data.message || "Session expired. Please log in again.";
              showLoginPage(); resolve(false); return;
            }
            songs = Array.isArray(data) ? data : [];
            songs.sort(function(a,b){ return String(a.name||"").localeCompare(String(b.name||""), undefined, {sensitivity:"base"}); });
            displaySongs(songs); resolve(true);
          } finally { delete window[callbackName]; if (script.parentNode) script.parentNode.removeChild(script); }
        };
        script.src = API_URL + "?action=getSongs" + "&token=" + encodeURIComponent(token) + "&callback=" + encodeURIComponent(callbackName);
        script.onerror = function(){ document.getElementById("message").textContent="Unable to load songs. Please try again."; delete window[callbackName]; if(script.parentNode)script.parentNode.removeChild(script); resolve(false); };
        document.body.appendChild(script);
      });
    }


    /* =====================================================
       DISPLAY SONGS
    ===================================================== */

    function displaySongs(
      list
    ) {

      const container =
        document.getElementById(
          "songs"
        );


      const message =
        document.getElementById(
          "message"
        );


      container.innerHTML =
        "";


      if (
        !list ||
        list.length === 0
      ) {

        message.textContent =
          "No songs found.";

        return;

      }


      message.textContent =
        "";


      list.forEach(
        function(song) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "song";


          div.textContent =
            song.name;


          div.addEventListener(
            "click",
            function() {

              openSong(
                song
              );

            }
          );


          container.appendChild(
            div
          );

        }
      );

    }


    /* =====================================================
       HOME SEARCH
    ===================================================== */

    document
      .getElementById(
        "search"
      )
      .addEventListener(
        "input",
        function() {

          const searchText =
            this.value
              .trim()
              .toLowerCase();


          if (!searchText) {

            displaySongs(
              songs
            );

            return;

          }


          const filtered =
            songs.filter(
              function(song) {

                return String(
                  song.name || ""
                )
                  .toLowerCase()
                  .includes(
                    searchText
                  );

              }
            );


          displaySongs(
            filtered
          );

        }
      );


    /* =====================================================
       SONG SEARCH
    ===================================================== */

    const songSearch =
      document.getElementById(
        "songSearch"
      );


    const songSearchResults =
      document.getElementById(
        "songSearchResults"
      );


    songSearch.addEventListener(
      "input",
      function() {

        const searchText =
          this.value
            .trim()
            .toLowerCase();


        if (!searchText) {

          songSearchResults
            .style
            .display =
            "none";


          songSearchResults
            .innerHTML =
            "";


          return;

        }


        const matches =
          songs.filter(
            function(song) {

              return String(
                song.name || ""
              )
                .toLowerCase()
                .includes(
                  searchText
                );

            }
          );


        songSearchResults
          .innerHTML =
          "";


        if (
          matches.length === 0
        ) {

          const noResults =
            document.createElement(
              "div"
            );


          noResults.className =
            "song-search-no-results";


          noResults.textContent =
            "No songs found.";


          songSearchResults
            .appendChild(
              noResults
            );


          songSearchResults
            .style
            .display =
            "block";


          return;

        }


        matches
          .slice(0, 15)
          .forEach(
            function(song) {

              const result =
                document.createElement(
                  "div"
                );


              result.className =
                "song-search-result";


              result.textContent =
                song.name;


              result.addEventListener(
                "click",
                function() {

                  openSongFromSearch(
                    song
                  );

                }
              );


              songSearchResults
                .appendChild(
                  result
                );

            }
          );


        songSearchResults
          .style
          .display =
          "block";

      }
    );


    /* =====================================================
       OPEN SONG FROM SEARCH
    ===================================================== */

    function openSongFromSearch(
      song
    ) {

      songSearch.value =
        "";


      songSearchResults
        .innerHTML =
        "";


      songSearchResults
        .style
        .display =
        "none";


      openSong(
        song
      );

    }


    /* =====================================================
       CLOSE SONG SEARCH
    ===================================================== */

    document.addEventListener(
      "click",
      function(event) {

        const container =
          document.querySelector(
            ".song-search-container"
          );


        if (
          container &&
          !container.contains(
            event.target
          )
        ) {

          songSearchResults
            .style
            .display =
            "none";

        }

      }
    );


    /* =====================================================
       OPEN SONG
    ===================================================== */

    function openSong(
      song
    ) {

      if (!song) {

        return;

      }


      currentSong =
        song;


      transposeAmount =
        0;


      document
        .getElementById(
          "homePage"
        )
        .style
        .display =
        "none";


      document
        .getElementById(
          "songPage"
        )
        .style
        .display =
        "block";


      document
        .getElementById(
          "songTitle"
        )
        .textContent =
        song.name;


      songSearch.value =
        "";


      songSearchResults
        .innerHTML =
        "";


      songSearchResults
        .style
        .display =
        "none";


      updateSong();


      window.scrollTo(
        0,
        0
      );

    }


    /* =====================================================
       TRANSPOSE UP
    ===================================================== */

    function transposeUp() {

      if (!currentSong) {

        return;

      }


      transposeAmount++;


      updateSong();

    }


    /* =====================================================
       TRANSPOSE DOWN
    ===================================================== */

    function transposeDown() {

      if (!currentSong) {

        return;

      }


      transposeAmount--;


      updateSong();

    }


    /* =====================================================
       UPDATE SONG
    ===================================================== */

    function updateSong() {

      if (!currentSong) {

        return;

      }


      const original =
        String(
          currentSong.chords || ""
        );


      const transposed =
        transposeChords(
          original,
          transposeAmount
        );


      document
        .getElementById(
          "chords"
        )
        .textContent =
        transposed;


      document
        .getElementById(
          "keyDisplay"
        )
        .textContent =
        "Key: " +
        getDisplayedKey(
          original,
          transposeAmount
        );

    }


    /* =====================================================
       REQUEST ACCESS
    ===================================================== */
    function submitAccessRequest() {
      const name = document.getElementById("requestName").value.trim();
      const email = document.getElementById("requestEmail").value.trim();
      const password = document.getElementById("requestPassword").value;
      const reason = document.getElementById("requestReason").value.trim();
      const message = document.getElementById("requestMessage");
      if (!name) { message.textContent="Please enter your name."; return; }
      if (!email) { message.textContent="Please enter your email."; return; }
      if (!password) { message.textContent="Please create a password."; return; }
      if (password.length < 6) { message.textContent="Password must be at least 6 characters."; return; }
      if (!reason) { message.textContent="Please tell us why you need access."; return; }
      message.textContent="Sending request...";
      const callbackName="accessRequest_"+Date.now(); const script=document.createElement("script");
      window[callbackName]=function(response){
        message.textContent=response.message||"Request submitted.";
        if(response.success){ document.getElementById("requestName").value=""; document.getElementById("requestEmail").value=""; document.getElementById("requestPassword").value=""; document.getElementById("requestReason").value=""; }
        delete window[callbackName]; if(script.parentNode)script.parentNode.removeChild(script);
      };
      script.src=API_URL+"?action=requestAccess"+"&name="+encodeURIComponent(name)+"&email="+encodeURIComponent(email)+"&password="+encodeURIComponent(password)+"&reason="+encodeURIComponent(reason)+"&callback="+encodeURIComponent(callbackName);
      script.onerror=function(){ message.textContent="Unable to send request. Please try again."; delete window[callbackName]; if(script.parentNode)script.parentNode.removeChild(script); };
      document.body.appendChild(script);
    }


    /* =====================================================
       BUTTON EVENTS
    ===================================================== */

    document
      .getElementById(
        "loginButton"
      )
      .addEventListener(
        "click",
        login
      );


    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        logout
      );


    /*
      Allow ENTER to log in.
    */

    document
      .getElementById(
        "loginPassword"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            login();

          }

        }
      );

    (function restoreSession() {
      const token = localStorage.getItem("jayro_token");
      if (token) { showHome(); loadSongs(); } else { showLoginPage(); }
    })();

  </script>


</body>
