<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VCCF Peymous Songs List</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* =========================
       LOGIN PAGE
    ========================= */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      margin-bottom: 5px;
    }

    .title {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    .login-input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;

      border: none;
      border-radius: 8px;

      font-size: 15px;
      outline: none;
    }

    .login-button {
      width: 100%;
      padding: 14px;

      background: #2563eb;
      color: white;

      border: none;
      border-radius: 8px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      position: relative;
      z-index: 100;
    }

    .login-button:hover {
      background: #1d4ed8;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .request-button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;

      background: transparent;
      color: #60a5fa;

      border: 1px solid #475569;
      border-radius: 8px;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    .message {
      min-height: 40px;
      margin-top: 15px;

      text-align: center;

      color: #f87171;
      font-size: 14px;
      line-height: 20px;
    }

    /* =========================
       APP PAGE
    ========================= */

    #appPage {
      display: none;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .app-container {
      max-width: 1000px;
      margin: auto;
    }

    .app-title {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      max-width: 600px;
      margin: auto;
    }

    #searchInput {
      flex: 1;

      padding: 14px;

      border: none;
      border-radius: 10px;

      font-size: 15px;
      outline: none;
    }

    .logout-button {
      padding: 0 20px;

      background: transparent;
      color: #60a5fa;

      border: 1px solid #475569;
      border-radius: 8px;

      font-weight: bold;

      cursor: pointer;
    }

    .logout-button:hover {
      background: #1e293b;
    }

    #songsContainer {
      margin-top: 40px;
    }

    .song-card {
      background: #1e293b;

      padding: 20px;
      margin-bottom: 12px;

      border-radius: 10px;

      cursor: pointer;

      transition: 0.2s;
    }

    .song-card:hover {
      background: #263449;
    }

    .song-name {
      font-size: 18px;
      font-weight: bold;
    }

    .song-chords {
      margin-top: 12px;

      color: #cbd5e1;

      white-space: pre-wrap;

      line-height: 1.6;
    }

    .status {
      text-align: center;
      color: #94a3b8;
      margin-top: 50px;
    }

  </style>
</head>

<body>

  <!-- =====================================================
       LOGIN PAGE
  ====================================================== -->

  <div id="loginPage">

    <div class="login-container">

      <div class="logo">🎵</div>

      <div class="title">
        Jayro Chords
      </div>

      <div class="subtitle">
        Sign in to access the chord library
      </div>

      <input
        type="email"
        id="emailInput"
        class="login-input"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        type="password"
        id="passwordInput"
        class="login-input"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        type="button"
        id="loginButton"
        class="login-button"
      >
        Login
      </button>

      <button
        type="button"
        id="requestButton"
        class="request-button"
      >
        Request Access
      </button>

      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       APP PAGE
  ====================================================== -->

  <div id="appPage">

    <div class="app-container">

      <div class="app-title">
        🎵 VCCF Peymous Songs List
      </div>

      <div class="toolbar">

        <input
          type="text"
          id="searchInput"
          placeholder="Search song..."
        >

        <button
          type="button"
          id="logoutButton"
          class="logout-button"
        >
          Logout
        </button>

      </div>

      <div id="songsContainer">

        <div class="status">
          Loading songs...
        </div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       FIREBASE + APPLICATION JAVASCRIPT
  ====================================================== -->

  <script>

    /* =====================================================
       FIREBASE CONFIG
    ===================================================== */

    const firebaseConfig = {

      apiKey: "AIzaSyDA81ZEdidhOJyUOlN8pIC4Y2zz0o07Wps",

      authDomain: "auth-543a0.firebaseapp.com",

      projectId: "auth-543a0",

      storageBucket: "auth-543a0.firebasestorage.app",

      messagingSenderId: "277890778144",

      appId: "1:277890778144:web:d1476a3e2c8aa61144e845",

      measurementId: "G-7TJHNT3J41"

    };


    /* =====================================================
       INITIALIZE FIREBASE
    ===================================================== */

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();


    /* =====================================================
       APPS SCRIPT WEB APP URL
    ===================================================== */

  const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzBa66P0S6V_UP_L7zutjkpad6B1LfETF87QEN8fWGK9Sg_52wAmUn5qdSH8A_25BGeNA/exec";


    /* =====================================================
       GET ELEMENTS
    ===================================================== */

    const loginPage =
      document.getElementById("loginPage");

    const appPage =
      document.getElementById("appPage");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const loginButton =
      document.getElementById("loginButton");

    const requestButton =
      document.getElementById("requestButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const loginMessage =
      document.getElementById("loginMessage");

    const searchInput =
      document.getElementById("searchInput");

    const songsContainer =
      document.getElementById("songsContainer");


    /* =====================================================
       SHOW LOGIN
    ===================================================== */

    function showLogin() {

      loginPage.style.display = "flex";

      appPage.style.display = "none";

      loginButton.disabled = false;

      loginButton.textContent = "Login";

    }


    /* =====================================================
       SHOW APP
    ===================================================== */

    function showApp() {

      loginPage.style.display = "none";

      appPage.style.display = "block";

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    loginButton.addEventListener("click", async function () {

      console.log("LOGIN BUTTON CLICKED");

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      /* Validate email */

      if (!email) {

        loginMessage.textContent =
          "Please enter your email.";

        return;

      }


      /* Validate password */

      if (!password) {

        loginMessage.textContent =
          "Please enter your password.";

        return;

      }


      loginButton.disabled = true;

      loginButton.textContent =
        "Signing in...";

      loginMessage.textContent = "";


      try {

        console.log("Attempting Firebase login...");

        const result =
          await auth.signInWithEmailAndPassword(
            email,
            password
          );


        console.log(
          "Firebase login successful:",
          result.user.email
        );


        loginMessage.textContent = "";

        showApp();

        loadSongs();


      } catch (error) {

        console.error(
          "Firebase login error:",
          error
        );


        loginButton.disabled = false;

        loginButton.textContent =
          "Login";


        let message =
          error.message;


        if (error.code === "auth/invalid-credential") {

          message =
            "Invalid email or password.";

        }

        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          message =
            "No account found with this email.";

        }

        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          message =
            "Incorrect password.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          message =
            "Invalid email address.";

        }

        else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          message =
            "Too many login attempts. Please try again later.";

        }


        loginMessage.textContent =
          message;

      }

    });


    /* =====================================================
       ENTER KEY LOGIN
    ===================================================== */

    passwordInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          loginButton.click();

        }

      }
    );


    /* =====================================================
       LOGOUT
    ===================================================== */

    logoutButton.addEventListener(
      "click",
      async function() {

        try {

          await auth.signOut();

          console.log("Logged out");

          showLogin();

          emailInput.value = "";

          passwordInput.value = "";

          songsContainer.innerHTML =
            '<div class="status">Loading songs...</div>';

        }

        catch(error) {

          console.error(
            "Logout error:",
            error
          );

        }

      }
    );


    /* =====================================================
       FIREBASE AUTH STATE
    ===================================================== */

    auth.onAuthStateChanged(
      function(user) {

        console.log(
          "Auth state changed:",
          user
            ? user.email
            : "Not logged in"
        );


        if (user) {

          showApp();

          loadSongs();

        }

        else {

          showLogin();

        }

      }
    );


    /* =====================================================
       LOAD SONGS
    ===================================================== */

    async function loadSongs() {

      songsContainer.innerHTML =
        '<div class="status">Loading songs...</div>';


      if (
        APPS_SCRIPT_URL ===
        "YOUR_APPS_SCRIPT_WEB_APP_URL"
      ) {

        songsContainer.innerHTML =
          '<div class="status">Apps Script URL has not been configured.</div>';

        return;

      }


      try {

        console.log(
          "Loading songs from Apps Script..."
        );


        const response =
          await fetch(
            APPS_SCRIPT_URL +
            "?action=getSongs"
          );


        if (!response.ok) {

          throw new Error(
            "HTTP error " +
            response.status
          );

        }


        const songs =
          await response.json();


        console.log(
          "Songs received:",
          songs
        );


        displaySongs(songs);

      }

      catch(error) {

        console.error(
          "Song loading error:",
          error
        );


        songsContainer.innerHTML =
          '<div class="status">Unable to load songs.</div>';

      }

    }


    /* =====================================================
       DISPLAY SONGS
    ===================================================== */

    function displaySongs(songs) {

      songsContainer.innerHTML = "";


      if (
        !songs ||
        songs.length === 0
      ) {

        songsContainer.innerHTML =
          '<div class="status">No songs found.</div>';

        return;

      }


      songs.forEach(function(song) {

        const card =
          document.createElement("div");

        card.className =
          "song-card";


        const name =
          document.createElement("div");

        name.className =
          "song-name";

        name.textContent =
          song.name || "Untitled";


        const chords =
          document.createElement("div");

        chords.className =
          "song-chords";

        chords.textContent =
          song.chords || "";


        card.appendChild(name);

        card.appendChild(chords);


        songsContainer.appendChild(card);

      });

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    searchInput.addEventListener(
      "input",
      function() {

        const search =
          searchInput.value
            .toLowerCase()
            .trim();


        const cards =
          document.querySelectorAll(
            ".song-card"
          );


        cards.forEach(function(card) {

          const text =
            card.textContent
              .toLowerCase();


          if (
            text.includes(search)
          ) {

            card.style.display =
              "block";

          }

          else {

            card.style.display =
              "none";

          }

        });

      }
    );


    /* =====================================================
       REQUEST ACCESS
    ===================================================== */

    requestButton.addEventListener(
      "click",
      function() {

        const email =
          emailInput.value.trim();


        if (!email) {

          loginMessage.textContent =
            "Enter your email first.";

          return;

        }


        loginMessage.textContent =
          "Access request feature coming soon.";

      }
    );

  </script>

</body>
</html>
