<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VCCF Peymous Songs List</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }


    /* =========================================
       HOME PAGE
    ========================================= */

    #homePage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 30px 15px 20px;
    }

    header h1 {
      margin: 0 0 20px;
      font-size: 32px;
    }

    #search {
      width: 90%;
      max-width: 500px;
      padding: 14px 16px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    #songs {
      width: 90%;
      max-width: 700px;
      margin: 10px auto 40px;
      flex: 1;
    }

    .song {
      background: #1e293b;
      padding: 17px;
      margin-bottom: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .song:hover {
      background: #334155;
      transform: translateY(-1px);
    }

    #message {
      text-align: center;
      color: #94a3b8;
      margin: 30px;
    }


    /* =========================================
       SONG PAGE
    ========================================= */

    #songPage {
      display: none;
      width: 90%;
      max-width: 800px;
      margin: 30px auto 0;
      min-height: calc(100vh - 30px);
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #60a5fa;
      font-weight: bold;
      cursor: pointer;
    }

    .back:hover {
      color: #93c5fd;
    }

    #songTitle {
      font-size: 34px;
      margin: 0 0 20px;
    }


    /* =========================================
       TRANSPOSE
    ========================================= */

    .transpose {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 15px;
      margin-bottom: 20px;
      background: #1e293b;
      border-radius: 10px;
    }

    .transpose span {
      font-weight: bold;
    }

    .transpose button {
      width: 45px;
      height: 40px;
      border: none;
      border-radius: 8px;
      background: #334155;
      color: white;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .transpose button:hover {
      background: #475569;
    }

    #keyDisplay {
      min-width: 80px;
      text-align: center;
      font-weight: bold;
    }


    /* =========================================
       CHORDS
    ========================================= */

    #chords {
      background: #111827;
      padding: 25px;
      border-radius: 10px;

      white-space: pre-wrap;

      font-family: "Courier New", monospace;

      font-size: 18px;

      line-height: 1.7;

      overflow-x: auto;
    }


    /* =========================================
       FOOTER
    ========================================= */

    .site-footer {
      margin-top: 50px;
      padding: 30px 20px;

      text-align: center;

      border-top: 1px solid #334155;

      color: #94a3b8;
    }

    .footer-brand {
      font-size: 18px;
      font-weight: bold;

      color: #ffffff;

      margin-bottom: 8px;

      letter-spacing: 0.3px;
    }

    .footer-copyright {
      font-size: 13px;
      color: #64748b;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      header h1 {
        font-size: 25px;
      }

      #songTitle {
        font-size: 28px;
      }

      #chords {
        font-size: 16px;
        padding: 18px;
      }

      .transpose {
        gap: 10px;
      }

      .transpose button {
        width: 42px;
        height: 38px;
      }

      .site-footer {
        margin-top: 40px;
        padding: 25px 15px;
      }

      .footer-brand {
        font-size: 16px;
      }

      .footer-copyright {
        font-size: 12px;
      }

    }

  </style>

</head>


<body>


  <!-- =======================================
       HOME PAGE
  ======================================= -->

  <div id="homePage">

    <header>

      <h1>
        🎵 VCCF Peymous Songs List
      </h1>

      <input
        id="search"
        type="text"
        placeholder="Search song..."
        autocomplete="off"
      >

    </header>


    <div id="songs"></div>


    <div id="message">
      Loading songs...
    </div>

  </div>



  <!-- =======================================
       SONG PAGE
  ======================================= -->

  <div id="songPage">


    <div
      class="back"
      onclick="showHome()"
    >
      ← Back to Songs
    </div>


    <h1 id="songTitle"></h1>


    <!-- =====================================
         TRANSPOSE
    ====================================== -->

    <div class="transpose">

      <span>
        Transpose
      </span>


      <button
        onclick="transposeDown()"
        title="Transpose down"
      >
        −
      </button>


      <div id="keyDisplay">
        Key: -
      </div>


      <button
        onclick="transposeUp()"
        title="Transpose up"
      >
        +
      </button>

    </div>


    <!-- =====================================
         CHORDS
    ====================================== -->

    <div id="chords"></div>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="site-footer">

      <div class="footer-brand">
        🎵 jayrochords.com
      </div>

      <div class="footer-copyright">
        © 2026 Jayro
      </div>

    </footer>


  </div>



<script>


  // =====================================================
  // GOOGLE APPS SCRIPT URL
  // =====================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyAbVFUV4zRmG9luRmr4sNeBB1H7OJZpIu5bghyfbZtvLaPr2sEm5Jo5W0qI8HkUdy9HQ/exec";


  // =====================================================
  // VARIABLES
  // =====================================================

  let songs = [];

  let currentSong = null;

  let transposeAmount = 0;


  // =====================================================
  // CHROMATIC NOTES
  //
  // PREFERRED DISPLAY:
  //
  // Ab -> G#
  // A# -> Bb
  //
  // This means transposed chords will use:
  //
  // G# instead of Ab
  // Bb instead of A#
  // =====================================================

  const chromaticNotes = [

    "C",
    "C#",
    "D",
    "Eb",
    "E",
    "F",
    "F#",
    "G",
    "G#",
    "A",
    "Bb",
    "B"

  ];


  // =====================================================
  // NOTE TO NUMBER
  // =====================================================

  function noteToNumber(note) {

    const map = {

      "C": 0,
      "B#": 0,

      "C#": 1,
      "Db": 1,

      "D": 2,

      "D#": 3,
      "Eb": 3,

      "E": 4,
      "Fb": 4,

      "F": 5,
      "E#": 5,

      "F#": 6,
      "Gb": 6,

      "G": 7,

      "G#": 8,
      "Ab": 8,

      "A": 9,

      "A#": 10,
      "Bb": 10,

      "B": 11,
      "Cb": 11

    };

    return map[note];

  }


  // =====================================================
  // TRANSPOSE ONE NOTE
  // =====================================================

  function transposeNote(
    note,
    amount
  ) {

    const number =
      noteToNumber(note);


    if (
      number === undefined
    ) {

      return note;

    }


    let newNumber =
      (
        number +
        amount
      ) % 12;


    if (
      newNumber < 0
    ) {

      newNumber += 12;

    }


    return chromaticNotes[
      newNumber
    ];

  }


  // =====================================================
  // TRANSPOSE CHORDS
  //
  // Handles:
  //
  // C
  // Cm
  // C7
  // Cmaj7
  // Csus4
  // C/F
  // Eb/F#
  // Cm/Bb
  // (Eb - Ab)
  // (Eb/F# - Ab)
  // =====================================================

  function transposeChords(
    text,
    amount
  ) {

    if (
      !text ||
      amount === 0
    ) {

      return text;

    }


    let result = text;


    // =================================================
    // STEP 1
    // TRANSPOSE CHORD ROOTS
    // =================================================

    const rootRegex =
      /(^|[\s(\[\{,;:\-])([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|\+|-|[0-9]|\/|[\s)\]\},;:.]|$))/g;


    result =
      result.replace(
        rootRegex,
        function(
          fullMatch,
          separator,
          root
        ) {

          return (
            separator +
            transposeNote(
              root,
              amount
            )
          );

        }
      );


    // =================================================
    // STEP 2
    // TRANSPOSE SLASH-CHORD BASS NOTES
    // =================================================

    const bassRegex =
      /\/([A-G](?:#|b)?)(?=[\s)\]\},;:.+\-]|$)/g;


    result =
      result.replace(
        bassRegex,
        function(
          fullMatch,
          bassNote
        ) {

          return (
            "/" +
            transposeNote(
              bassNote,
              amount
            )
          );

        }
      );


    return result;

  }


  // =====================================================
  // FIND ORIGINAL KEY
  // =====================================================

  function getOriginalKey(text) {

    if (!text) {
      return "-";
    }


    // Look for key at beginning.
    //
    // Example:
    //
    // (Eb)
    // (Ab)
    // (F#)

    const keyAtStart =
      text.match(
        /^\s*\(?([A-G](?:#|b)?)\)?/
      );


    if (keyAtStart) {

      return keyAtStart[1];

    }


    // Otherwise find first chord.

    const firstChord =
      text.match(
        /(?:^|[\s(\[])([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|[0-9]|\/|[\s)\],;:.]|$))/
      );


    if (!firstChord) {

      return "-";

    }


    return firstChord[1];

  }


  // =====================================================
  // GET DISPLAYED KEY
  // =====================================================

  function getDisplayedKey(
    text,
    amount
  ) {

    const originalKey =
      getOriginalKey(text);


    const number =
      noteToNumber(
        originalKey
      );


    if (
      number === undefined
    ) {

      return "-";

    }


    let newNumber =
      (
        number +
        amount
      ) % 12;


    if (
      newNumber < 0
    ) {

      newNumber += 12;

    }


    return chromaticNotes[
      newNumber
    ];

  }


  // =====================================================
  // LOAD SONGS
  // =====================================================

  function loadSongs() {

    const callbackName =
      "receiveSongs_" +
      Date.now();


    window[callbackName] =
      function(data) {

        songs =
          Array.isArray(data)
            ? data
            : [];


        // Sort alphabetically A-Z

        songs.sort(
          function(a, b) {

            return String(
              a.name || ""
            ).localeCompare(
              String(
                b.name || ""
              ),
              undefined,
              {
                sensitivity: "base"
              }
            );

          }
        );


        delete window[
          callbackName
        ];


        const oldScript =
          document.getElementById(
            "songsApiScript"
          );


        if (oldScript) {

          oldScript.remove();

        }


        displaySongs(
          songs
        );

      };


    const script =
      document.createElement(
        "script"
      );


    script.id =
      "songsApiScript";


    script.src =
      API_URL +
      "?callback=" +
      encodeURIComponent(
        callbackName
      );


    script.onerror =
      function() {

        document
          .getElementById(
            "message"
          )
          .textContent =
          "Unable to load songs. Please try again.";


        delete window[
          callbackName
        ];


        script.remove();

      };


    document
      .body
      .appendChild(
        script
      );

  }


  // =====================================================
  // DISPLAY SONGS
  // =====================================================

  function displaySongs(
    list
  ) {

    const container =
      document.getElementById(
        "songs"
      );


    const message =
      document.getElementById(
        "message"
      );


    container.innerHTML =
      "";


    if (
      !list ||
      list.length === 0
    ) {

      message.textContent =
        "No songs found.";

      return;

    }


    message.textContent =
      "";


    list.forEach(
      function(song) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "song";


        div.textContent =
          song.name;


        div.onclick =
          function() {

            openSong(
              song
            );

          };


        container.appendChild(
          div
        );

      }
    );

  }


  // =====================================================
  // SEARCH
  // =====================================================

  document
    .getElementById(
      "search"
    )
    .addEventListener(
      "input",
      function() {

        const searchText =
          this.value
            .trim()
            .toLowerCase();


        if (!searchText) {

          displaySongs(
            songs
          );

          return;

        }


        const filtered =
          songs.filter(
            function(song) {

              return String(
                song.name || ""
              )
              .toLowerCase()
              .includes(
                searchText
              );

            }
          );


        displaySongs(
          filtered
        );

      }
    );


  // =====================================================
  // OPEN SONG
  // =====================================================

  function openSong(
    song
  ) {

    currentSong =
      song;


    transposeAmount =
      0;


    document
      .getElementById(
        "homePage"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "songPage"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "songTitle"
      )
      .textContent =
      song.name;


    updateSong();


    window.scrollTo(
      0,
      0
    );

  }


  // =====================================================
  // SHOW HOME
  // =====================================================

  function showHome() {

    currentSong =
      null;


    transposeAmount =
      0;


    document
      .getElementById(
        "songPage"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "homePage"
      )
      .style.display =
      "flex";


    window.scrollTo(
      0,
      0
    );

  }


  // =====================================================
  // TRANSPOSE UP
  // =====================================================

  function transposeUp() {

    if (!currentSong) {

      return;

    }


    transposeAmount++;


    updateSong();

  }


  // =====================================================
  // TRANSPOSE DOWN
  // =====================================================

  function transposeDown() {

    if (!currentSong) {

      return;

    }


    transposeAmount--;


    updateSong();

  }


  // =====================================================
  // UPDATE SONG
  // =====================================================

  function updateSong() {

    if (!currentSong) {

      return;

    }


    const original =
      String(
        currentSong.chords || ""
      );


    const transposed =
      transposeChords(
        original,
        transposeAmount
      );


    document
      .getElementById(
        "chords"
      )
      .textContent =
      transposed;


    document
      .getElementById(
        "keyDisplay"
      )
      .textContent =
      "Key: " +
      getDisplayedKey(
        original,
        transposeAmount
      );

  }


  // =====================================================
  // START APPLICATION
  // =====================================================

  loadSongs();

</script>


</body>

</html>
