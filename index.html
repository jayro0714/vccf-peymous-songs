<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VCCF Peymous Songs List</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      min-height: 100vh;
    }


    /* ==============================
       HEADER
    ============================== */

    header {
      background: #0f172a;
      padding: 30px 20px;
      text-align: center;
    }


    h1 {
      margin: 0 0 20px;
      font-size: 30px;
    }


    #search {
      width: 100%;
      max-width: 500px;
      padding: 14px 16px;

      border-radius: 10px;
      border: none;

      font-size: 16px;

      outline: none;
    }


    /* ==============================
       SONG LIST
    ============================== */

    #songs {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }


    .song {
      background: #1f2937;

      padding: 18px;

      margin-bottom: 10px;

      border-radius: 10px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.1s ease;
    }


    .song:hover {
      background: #374151;
    }


    .song:active {
      transform: scale(0.99);
    }


    .song-name {
      font-size: 18px;
      font-weight: bold;
    }


    /* ==============================
       NO RESULTS
    ============================== */

    #noResults {
      display: none;

      text-align: center;

      color: #9ca3af;

      padding: 40px 20px;
    }


    /* ==============================
       LOADING
    ============================== */

    #loading {
      text-align: center;

      color: #9ca3af;

      padding: 40px 20px;
    }


    /* ==============================
       SONG VIEWER
    ============================== */

    #viewer {
      display: none;

      max-width: 750px;

      margin: 0 auto;

      padding: 25px 20px;
    }


    .back {
      display: inline-block;

      margin-bottom: 25px;

      color: #60a5fa;

      font-weight: bold;

      cursor: pointer;
    }


    .back:hover {
      color: #93c5fd;
    }


    #songTitle {
      font-size: 32px;

      margin-bottom: 20px;
    }


    #chords {
      background: #0f172a;

      padding: 22px;

      border-radius: 10px;

      white-space: pre-wrap;

      overflow-x: auto;

      font-family: monospace;

      font-size: 17px;

      line-height: 1.8;

      min-height: 70px;
    }


    .no-chords {
      color: #9ca3af;
      font-family: Arial, sans-serif;
    }


    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 600px) {

      header {
        padding: 25px 15px;
      }


      h1 {
        font-size: 25px;
      }


      #songs {
        padding: 15px;
      }


      .song {
        padding: 16px;
      }


      .song-name {
        font-size: 17px;
      }


      #viewer {
        padding: 20px 15px;
      }


      #songTitle {
        font-size: 27px;
      }


      #chords {
        font-size: 16px;

        padding: 18px;

        line-height: 1.7;
      }

    }

  </style>

</head>


<body>


  <!-- =================================
       SONG LIST
  ================================== -->

  <header id="header">

    <h1>
      🎵 VCCF Peymous Songs List
    </h1>


    <input
      id="search"
      type="text"
      placeholder="Search song..."
      autocomplete="off"
    >

  </header>


  <div id="loading">
    Loading songs...
  </div>


  <div id="songs"></div>


  <div id="noResults">
    No songs found.
  </div>


  <!-- =================================
       SONG VIEWER
  ================================== -->

  <div id="viewer">

    <div
      class="back"
      onclick="goBack()"
    >
      ← Back to Songs
    </div>


    <h1 id="songTitle"></h1>


    <div id="chords"></div>

  </div>


  <script>


    // ==================================
    // YOUR APPS SCRIPT API
    // ==================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycby8BE2i_DU_WeabT9sW-ZdPTW8y4WuAmDR9jWVsqBnSe8Gi4klSrgy2Xe19kAcVfpbWVw/exec";


    let songs = [];


    // ==================================
    // LOAD SONGS
    // ==================================

    function loadSongs() {

      const script =
        document.createElement("script");


      script.src =
        API_URL +
        "?callback=receiveSongs";


      script.onerror =
        function() {

          showError();

        };


      document.body.appendChild(script);

    }


    // ==================================
    // RECEIVE DATA FROM APPS SCRIPT
    // ==================================

    function receiveSongs(data) {

      console.log("Songs received:", data);


      document
        .getElementById("loading")
        .style.display = "none";


      if (!Array.isArray(data)) {

        showError();

        return;

      }


      songs = data;


      displaySongs(songs);

    }


    // ==================================
    // ERROR
    // ==================================

    function showError() {

      document
        .getElementById("loading")
        .textContent =
        "Unable to load songs. Please try again.";

      console.error(
        "Unable to load songs from Apps Script."
      );

    }


    // ==================================
    // DISPLAY SONGS
    // ==================================

    function displaySongs(list) {

      const container =
        document.getElementById("songs");


      const noResults =
        document.getElementById("noResults");


      container.innerHTML = "";


      if (
        !list ||
        list.length === 0
      ) {

        noResults.style.display =
          "block";

        return;

      }


      noResults.style.display =
        "none";


      list.forEach(function(song) {

        const div =
          document.createElement("div");


        div.className =
          "song";


        const name =
          document.createElement("div");


        name.className =
          "song-name";


        name.textContent =
          song.name;


        div.appendChild(name);


        // IMPORTANT:
        // Pass the actual song object.
        // This prevents search results
        // from opening the wrong song.

        div.onclick =
          function() {

            openSong(song);

          };


        container.appendChild(div);

      });

    }


    // ==================================
    // SEARCH
    // ==================================

    document
      .getElementById("search")
      .addEventListener(
        "input",
        function() {

          const search =
            this.value
              .toLowerCase()
              .trim();


          // Empty search
          // = show everything

          if (search === "") {

            displaySongs(songs);

            return;

          }


          const filtered =
            songs.filter(
              function(song) {

                const songName =
                  song.name
                    .toLowerCase()
                    .trim();


                // Search must start
                // from beginning of title

                return songName
                  .startsWith(search);

              }
            );


          displaySongs(filtered);

        }
      );


    // ==================================
    // OPEN SONG
    // ==================================

    function openSong(song) {

      document
        .getElementById("header")
        .style.display =
        "none";


      document
        .getElementById("loading")
        .style.display =
        "none";


      document
        .getElementById("songs")
        .style.display =
        "none";


      document
        .getElementById("noResults")
        .style.display =
        "none";


      document
        .getElementById("viewer")
        .style.display =
        "block";


      document
        .getElementById("songTitle")
        .textContent =
        song.name;


      const chords =
        document.getElementById("chords");


      // Show Notes/chords

      if (
        song.chords &&
        song.chords.trim() !== ""
      ) {

        chords.textContent =
          song.chords;


        chords.classList
          .remove("no-chords");

      }

      else {

        chords.textContent =
          "No chords added yet.";


        chords.classList
          .add("no-chords");

      }


      window.scrollTo(0, 0);

    }


    // ==================================
    // BACK
    // ==================================

    function goBack() {

      document
        .getElementById("viewer")
        .style.display =
        "none";


      document
        .getElementById("header")
        .style.display =
        "block";


      document
        .getElementById("songs")
        .style.display =
        "block";


      window.scrollTo(0, 0);

    }


    // ==================================
    // START
    // ==================================

    loadSongs();


  </script>


</body>

</html>
