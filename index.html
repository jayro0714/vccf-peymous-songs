  <script>


    /* =====================================================
       APPS SCRIPT
    ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyAbVFUV4zRmG9luRmr4sNeBB1H7OJZpIu5bghyfbZtvLaPr2sEm5Jo5W0qI8HkUdy9HQ/exec";


    /* =====================================================
       VARIABLES
    ===================================================== */

    let songs = [];

    let currentSong = null;

    let transposeAmount = 0;


    /* =====================================================
       CHROMATIC NOTES
    ===================================================== */

    const chromaticNotes = [

      "C",
      "C#",
      "D",
      "Eb",
      "E",
      "F",
      "F#",
      "G",
      "G#",
      "A",
      "Bb",
      "B"

    ];


    /* =====================================================
       NOTE → NUMBER
    ===================================================== */

    function noteToNumber(note) {

      const map = {

        "C": 0,
        "B#": 0,

        "C#": 1,
        "Db": 1,

        "D": 2,

        "D#": 3,
        "Eb": 3,

        "E": 4,
        "Fb": 4,

        "F": 5,
        "E#": 5,

        "F#": 6,
        "Gb": 6,

        "G": 7,

        "G#": 8,
        "Ab": 8,

        "A": 9,

        "A#": 10,
        "Bb": 10,

        "B": 11,
        "Cb": 11

      };

      return map[note];

    }


    /* =====================================================
       TRANSPOSE NOTE
    ===================================================== */

    function transposeNote(
      note,
      amount
    ) {

      const number =
        noteToNumber(note);


      if (
        number === undefined
      ) {

        return note;

      }


      let newNumber =
        (
          number +
          amount
        ) % 12;


      if (
        newNumber < 0
      ) {

        newNumber += 12;

      }


      return chromaticNotes[
        newNumber
      ];

    }


    /* =====================================================
       TRANSPOSE CHORDS
    ===================================================== */

    function transposeChords(
      text,
      amount
    ) {

      if (
        !text ||
        amount === 0
      ) {

        return text;

      }


      let result = text;


      /* Main chord roots */

      const rootRegex =
        /(^|[\s(\[\{,;:\-])([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|\+|-|[0-9]|\/|[\s)\]\},;:.]|$))/g;


      result =
        result.replace(
          rootRegex,
          function(
            fullMatch,
            separator,
            root
          ) {

            return (
              separator +
              transposeNote(
                root,
                amount
              )
            );

          }
        );


      /* Slash chord bass notes */

      const bassRegex =
        /\/([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|\+|-|[0-9]|[\s)\]\},;:.]|$))/g;


      result =
        result.replace(
          bassRegex,
          function(
            fullMatch,
            bassNote
          ) {

            return (
              "/" +
              transposeNote(
                bassNote,
                amount
              )
            );

          }
        );


      return result;

    }


    /* =====================================================
       ORIGINAL KEY
    ===================================================== */

    function getOriginalKey(text) {

      if (!text) {

        return "-";

      }


      const keyAtStart =
        text.match(
          /^\s*\(?([A-G](?:#|b)?)\)?/
        );


      if (keyAtStart) {

        return keyAtStart[1];

      }


      const firstChord =
        text.match(
          /(?:^|[\s(\[])([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|[0-9]|\/|[\s)\],;:.]|$))/
        );


      if (!firstChord) {

        return "-";

      }


      return firstChord[1];

    }


    /* =====================================================
       DISPLAYED KEY
    ===================================================== */

    function getDisplayedKey(
      text,
      amount
    ) {

      const originalKey =
        getOriginalKey(text);


      const number =
        noteToNumber(
          originalKey
        );


      if (
        number === undefined
      ) {

        return "-";

      }


      let newNumber =
        (
          number +
          amount
        ) % 12;


      if (
        newNumber < 0
      ) {

        newNumber += 12;

      }


      return chromaticNotes[
        newNumber
      ];

    }


    /* =====================================================
       SHOW LOGIN
    ===================================================== */

    function showLoginPage() {

      document

        .style.display = "flex";


      document
        .getElementById("requestPage")

      document

    /* =====================================================
       SHOW REQUEST PAGE
    ===================================================== */

    function showRequestPage() {

      document
        .getElementById("loginPage")
        .style.display = "none";


      document
        .getElementById("requestPage")
        .style.display = "flex";


      document
        .getElementById("requestMessage")
        .textContent = "";

    }


    /* =====================================================
       SUBMIT ACCESS REQUEST
    ===================================================== */

    function submitAccessRequest() {

      const name =
        document
          .getElementById("requestName")
          .value
          .trim();


      const email =
        document
          .getElementById("requestEmail")
          .value
          .trim();


      const reason =
        document
          .getElementById("requestReason")
          .value
          .trim();


      const message =
        document.getElementById(
          "requestMessage"
        );


      if (!name) {

        message.textContent =
          "Please enter your name.";

        return;

      }


      if (!email) {

        message.textContent =
          "Please enter your email.";

        return;

      }


      if (!reason) {

        message.textContent =
          "Please tell us why you need access.";

        return;

      }


      message.textContent =
        "Sending request...";


      const callbackName =
        "accessRequest_" +
        Date.now();


      window[callbackName] =
        function(response) {

          message.textContent =
            response.message ||
            "Request submitted.";


          if (
            response.success
          ) {

            document
              .getElementById("requestName")
              .value = "";

            document
              .getElementById("requestEmail")
              .value = "";

            document
              .getElementById("requestReason")
              .value = "";

          }


          delete window[
            callbackName
          ];


          const script =
            document.getElementById(
              "accessRequestScript"
            );


          if (script) {

            script.remove();

          }

        };


      const script =
        document.createElement(
          "script"
        );


      script.id =
        "accessRequestScript";


      script.src =
        API_URL +
        "?action=requestAccess" +
        "&name=" +
        encodeURIComponent(name) +
        "&email=" +
        encodeURIComponent(email) +
        "&reason=" +
        encodeURIComponent(reason) +
        "&callback=" +
        encodeURIComponent(callbackName);


      script.onerror =
        function() {

          message.textContent =
            "Unable to send request. Please try again.";

          delete window[
            callbackName
          ];

          script.remove();

        };


      document
        .body
        .appendChild(script);

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    async function login() {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("loginPassword")
          .value;


      const message =
        document.getElementById(
          "loginMessage"
        );


      if (!email) {

        message.textContent =
          "Please enter your email.";

        return;

      }


      if (!password) {

        message.textContent =
          "Please enter your password.";

        return;

      }


      message.textContent =
        "Signing in...";


      try {

        await firebaseAuth
          .signInWithEmailAndPassword(
            email,
            password
          );


        message.textContent = "";

      }

      catch (error) {

        console.error(
          "Firebase login error:",
          error
        );


        switch (
          error.code
        ) {

          case "auth/invalid-email":

            message.textContent =
              "Please enter a valid email address.";

            break;


          case "auth/user-not-found":

          case "auth/wrong-password":

          case "auth/invalid-credential":

            message.textContent =
              "Incorrect email or password.";

            break;


          case "auth/too-many-requests":

            message.textContent =
              "Too many attempts. Please try again later.";

            break;


          case "auth/user-disabled":

            message.textContent =
              "This account has been disabled.";

            break;


          default:

            message.textContent =
              error.message ||
              "Unable to log in.";

        }

      }

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    async function logout() {

      try {

        await firebaseAuth.signOut();


        document
          .getElementById("loginEmail")
          .value = "";


        document
          .getElementById("loginPassword")
          .value = "";


        document
          .getElementById("loginMessage")
          .textContent = "";

      }

      catch (error) {

        console.error(
          "Logout error:",
          error
        );

      }

    }


    /* =====================================================
       FIREBASE SESSION
    ===================================================== */

    firebaseAuth.onAuthStateChanged(
      function(user) {

        if (user) {

          showHome();

          if (!songs.length) {

            loadSongs();

          }

        }

        else {

          showLoginPage();

        }

      }
    );


    /* =====================================================
       LOAD SONGS
    ===================================================== */

    function loadSongs() {

      const message =
        document.getElementById(
          "message"
        );


      message.textContent =
        "Loading songs...";


      const callbackName =
        "receiveSongs_" +
        Date.now();


      window[callbackName] =
        function(data) {

          songs =
            Array.isArray(data)
              ? data
              : [];


          songs.sort(
            function(a, b) {

              return String(
                a.name || ""
              ).localeCompare(
                String(
                  b.name || ""
                ),
                undefined,
                {
                  sensitivity: "base"
                }
              );

            }
          );


          delete window[
            callbackName
          ];


          const oldScript =
            document.getElementById(
              "songsApiScript"
            );


          if (oldScript) {

            oldScript.remove();

          }


          displaySongs(
            songs
          );

        };


      const script =
        document.createElement(
          "script"
        );


      script.id =
        "songsApiScript";


      script.src =
        API_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          message.textContent =
            "Unable to load songs. Please try again.";

          delete window[
            callbackName
          ];

          script.remove();

        };


      document
        .body
        .appendChild(script);

    }


    /* =====================================================
       DISPLAY SONGS
    ===================================================== */

    function displaySongs(
      list
    ) {

      const container =
        document.getElementById(
          "songs"
        );


      const message =
        document.getElementById(
          "message"
        );


      container.innerHTML =
        "";


      if (
        !list ||
        list.length === 0
      ) {

        message.textContent =
          "No songs found.";

        return;

      }


      message.textContent =
        "";


      list.forEach(
        function(song) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "song";


          div.textContent =
            song.name ||
            "Untitled";


          div.onclick =
            function() {

              openSong(
                song
              );

            };


          container.appendChild(
            div
          );

        }
      );

    }


    /* =====================================================
       HOME SEARCH
    ===================================================== */

    document
      .getElementById("search")
      .addEventListener(
        "input",
        function() {

          const searchText =
            this.value
              .trim()
              .toLowerCase();


          if (!searchText) {

            displaySongs(
              songs
            );

            return;

          }


          const filtered =
            songs.filter(
              function(song) {

                return String(
                  song.name || ""
                )
                .toLowerCase()
                .includes(
                  searchText
                );

              }
            );


          displaySongs(
            filtered
          );

        }
      );


    /* =====================================================
       SONG SEARCH
    ===================================================== */

    const songSearch =
      document.getElementById(
        "songSearch"
      );


    const songSearchResults =
      document.getElementById(
        "songSearchResults"
      );


    songSearch.addEventListener(
      "input",
      function() {

        const searchText =
          this.value
            .trim()
            .toLowerCase();


        if (!searchText) {

          songSearchResults.style.display =
            "none";

          songSearchResults.innerHTML =
            "";

          return;

        }


        const matches =
          songs.filter(
            function(song) {

              return String(
                song.name || ""
              )
              .toLowerCase()
              .includes(
                searchText
              );

            }
          );


        songSearchResults.innerHTML =
          "";


        if (
          matches.length === 0
        ) {

          const noResults =
            document.createElement(
              "div"
            );


          noResults.className =
            "song-search-no-results";


          noResults.textContent =
            "No songs found.";


          songSearchResults.appendChild(
            noResults
          );


          songSearchResults.style.display =
            "block";


          return;

        }


        matches
          .slice(0, 15)
          .forEach(
            function(song) {

              const result =
                document.createElement(
                  "div"
                );


              result.className =
                "song-search-result";


              result.textContent =
                song.name;


              result.onclick =
                function() {

                  openSongFromSearch(
                    song
                  );

                };


              songSearchResults.appendChild(
                result
              );

            }
          );


        songSearchResults.style.display =
          "block";

      }
    );


    /* =====================================================
       CLOSE SONG SEARCH
    ===================================================== */

    document.addEventListener(
      "click",
      function(event) {

        const container =
          document.querySelector(
            ".song-search-container"
          );


        if (
          container &&
          !container.contains(
            event.target
          )
        ) {

          songSearchResults.style.display =
            "none";

        }

      }
    );


    /* =====================================================
       OPEN SONG FROM SEARCH
    ===================================================== */

    function openSongFromSearch(
      song
    ) {

      songSearch.value =
        "";


      songSearchResults.innerHTML =
        "";


      songSearchResults.style.display =
        "none";


      openSong(
        song
      );

    }


    /* =====================================================
       OPEN SONG
    ===================================================== */

    function openSong(
      song
    ) {

      currentSong =
        song;


      transposeAmount =
        0;


      document
        .getElementById("homePage")
        .style.display =
        "none";


      document
        .getElementById("songPage")
        .style.display =
        "block";


      document
        .getElementById("songTitle")
        .textContent =
        song.name ||
        "Untitled";


      songSearch.value =
        "";


      songSearchResults.innerHTML =
        "";


      songSearchResults.style.display =
        "none";


      updateSong();


      window.scrollTo(
        0,
        0
      );

    }


    /* =====================================================
       SHOW HOME
    ===================================================== */

    function showHome() {

      if (
        !firebaseAuth.currentUser
      ) {

        showLoginPage();

        return;

      }


      currentSong =
        null;


      transposeAmount =
        0;


      songSearch.value =
        "";


      songSearchResults.innerHTML =
        "";


      songSearchResults.style.display =
        "none";


      document
        .getElementById("songPage")
        .style.display =
        "none";


      document
        .getElementById("homePage")
        .style.display =
        "flex";


      window.scrollTo(
        0,
        0
      );

    }


    /* =====================================================
       TRANSPOSE UP
    ===================================================== */

    function transposeUp() {

      if (!currentSong) {

        return;

      }


      transposeAmount++;


      updateSong();

    }


    /* =====================================================
       TRANSPOSE DOWN
    ===================================================== */

    function transposeDown() {

      if (!currentSong) {

        return;

      }


      transposeAmount--;


      updateSong();

    }


    /* =====================================================
       UPDATE SONG
    ===================================================== */

    function updateSong() {

      if (!currentSong) {

        return;

      }


      const original =
        String(
          currentSong.chords || ""
        );


      const transposed =
        transposeChords(
          original,
          transposeAmount
        );


      document
        .getElementById("chords")
        .textContent =
        transposed;


      document
        .getElementById("keyDisplay")
        .textContent =
        "Key: " +
        getDisplayedKey(
          original,
          transposeAmount
        );

    }


    /* =====================================================
       START
    ===================================================== */

    showLoginPage();


  </script>


</body>
</html>
