<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jayro Chords</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =====================================================
       LOGIN
    ===================================================== */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      text-align: center;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .login-box h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .login-subtitle {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .login-input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background: #f1f5f9;
      color: #111827;
    }

    .login-button,
    .request-button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
    }

    .login-button {
      border: none;
      background: #2563eb;
      color: white;
      margin-top: 4px;
    }

    .login-button:hover {
      background: #1d4ed8;
    }

    .login-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .request-button {
      margin-top: 10px;
      border: 1px solid #475569;
      background: transparent;
      color: #60a5fa;
    }

    .request-button:hover {
      background: #263449;
    }

    .login-message {
      min-height: 25px;
      margin-top: 15px;
      color: #fca5a5;
      font-size: 14px;
      line-height: 1.4;
    }

    /* =====================================================
       REQUEST ACCESS
    ===================================================== */

    #requestPage {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .request-box {
      width: 100%;
      max-width: 450px;
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
    }

    .request-box h1 {
      text-align: center;
      margin-top: 0;
    }

    .request-subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .request-label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    .request-input,
    .request-textarea {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      outline: none;
      background: #f1f5f9;
      color: #111827;
      font-size: 15px;
    }

    .request-textarea {
      min-height: 120px;
      resize: vertical;
    }

    .submit-request {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    .back-login {
      text-align: center;
      margin-top: 20px;
      color: #60a5fa;
      cursor: pointer;
    }

    /* =====================================================
       HOME
    ===================================================== */

    #homePage {
      display: none;
      min-height: 100vh;
      padding: 35px 20px 60px;
    }

    .home-container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
    }

    .home-header {
      text-align: center;
    }

    .home-header h1 {
      margin: 0 0 25px;
      font-size: 32px;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 30px;
    }

    #search {
      width: min(500px, 100%);
      padding: 13px 16px;
      border: none;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
      background: #f1f5f9;
      color: #111827;
    }

    .logout-button {
      padding: 0 18px;
      border-radius: 9px;
      border: 1px solid #475569;
      background: transparent;
      color: #60a5fa;
      font-weight: bold;
    }

    .logout-button:hover {
      background: #1e293b;
    }

    #songs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }

    .song {
      padding: 18px;
      background: #1e293b;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid transparent;
    }

    .song:hover {
      background: #263449;
      border-color: #3b82f6;
      transform: translateY(-1px);
    }

    .song-name {
      font-weight: bold;
      font-size: 16px;
    }

    #message {
      text-align: center;
      color: #94a3b8;
      margin-top: 40px;
    }

    /* =====================================================
       SONG PAGE
    ===================================================== */

    #songPage {
      display: none;
      min-height: 100vh;
      padding: 25px 20px 60px;
    }

    .song-page-container {
      max-width: 950px;
      margin: auto;
    }

    .song-navigation {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 25px;
    }

    .back {
      display: inline-block;
      color: #60a5fa;
      font-weight: bold;
      cursor: pointer;
      padding: 10px 0;
    }

    .back:hover {
      color: #93c5fd;
    }

    .song-search-container {
      position: relative;
      width: 300px;
    }

    #songSearch {
      width: 100%;
      padding: 11px 13px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #f1f5f9;
      color: #111827;
    }

    #songSearchResults {
      display: none;
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      z-index: 20;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }

    .song-search-result {
      padding: 12px;
      cursor: pointer;
      border-bottom: 1px solid #334155;
    }

    .song-search-result:hover {
      background: #334155;
    }

    .song-search-no-results {
      padding: 12px;
      color: #94a3b8;
    }

    #songTitle {
      font-size: 34px;
      margin: 10px 0 20px;
    }

    /* =====================================================
       TRANSPOSE
    ===================================================== */

    .transpose {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 12px 15px;
      background: #1e293b;
      border-radius: 10px;
      width: fit-content;
    }

    .transpose span {
      color: #94a3b8;
      font-weight: bold;
    }

    .transpose button {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 24px;
    }

    .transpose button:hover {
      background: #334155;
    }

    #keyDisplay {
      min-width: 75px;
      text-align: center;
      font-weight: bold;
    }

    /* =====================================================
       CHORDS
    ===================================================== */

    #chords {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-x: auto;
      font-family: monospace;
      font-size: 17px;
      line-height: 1.8;
      color: #dbeafe;
      min-height: 100px;
    }

    .site-footer {
      text-align: center;
      color: #64748b;
      margin-top: 50px;
      padding: 25px;
    }

    @media (max-width: 600px) {

      #loginPage {
        padding: 15px;
      }

      .login-box {
        padding: 25px 20px;
      }

      .home-header h1 {
        font-size: 25px;
      }

      .toolbar {
        flex-direction: column;
      }

      #search {
        width: 100%;
      }

      .logout-button {
        padding: 11px;
      }

      .song-navigation {
        flex-direction: column;
      }

      .song-search-container {
        width: 100%;
      }

      #songTitle {
        font-size: 28px;
      }

      .transpose {
        width: 100%;
        justify-content: center;
      }

      #chords {
        font-size: 15px;
        padding: 18px;
      }
    }

  </style>
</head>

<body>

  <!-- =====================================================
       LOGIN PAGE
  ===================================================== -->

  <div id="loginPage">

    <div class="login-box">

      <div class="logo">🎵</div>

      <h1>Jayro Chords</h1>

      <div class="login-subtitle">
        Sign in to access the chord library
      </div>

      <input
        id="loginEmail"
        class="login-input"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        class="login-input"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        class="login-button"
        type="button"
      >
        Login
      </button>

      <button
        id="requestButton"
        class="request-button"
        type="button"
      >
        Request Access
      </button>

      <div id="loginMessage" class="login-message"></div>

    </div>

  </div>


  <!-- =====================================================
       REQUEST ACCESS
  ===================================================== -->

  <div id="requestPage">

    <div class="request-box">

      <h1>Request Access</h1>

      <div class="request-subtitle">
        Request access to the Jayro Chords library.
      </div>

      <label class="request-label">
        Name
      </label>

      <input
        id="requestName"
        class="request-input"
        type="text"
        placeholder="Your name"
      >

      <label class="request-label">
        Email
      </label>

      <input
        id="requestEmail"
        class="request-input"
        type="email"
        placeholder="you@example.com"
      >

      <label class="request-label">
        Why do you need access?
      </label>

      <textarea
        id="requestReason"
        class="request-textarea"
        placeholder="Tell us a little about why you need access..."
      ></textarea>

      <button
        id="submitRequestButton"
        class="submit-request"
        type="button"
      >
        Send Request
      </button>

      <div id="requestMessage" class="login-message"></div>

      <div
        id="backLogin"
        class="back-login"
      >
        ← Back to Login
      </div>

    </div>

  </div>


  <!-- =====================================================
       HOME PAGE
  ===================================================== -->

  <div id="homePage">

    <div class="home-container">

      <header class="home-header">

        <h1>
          🎵 VCCF Peymous Songs List
        </h1>

        <div class="toolbar">

          <input
            id="search"
            type="text"
            placeholder="Search song..."
            autocomplete="off"
          >

          <button
            id="logoutButton"
            class="logout-button"
            type="button"
          >
            Logout
          </button>

        </div>

      </header>

      <div id="songs"></div>

      <div id="message">
        Loading songs...
      </div>

    </div>

  </div>


  <!-- =====================================================
       SONG PAGE
  ===================================================== -->

  <div id="songPage">

    <div class="song-page-container">

      <div class="song-navigation">

        <div
          id="backButton"
          class="back"
        >
          ← Back to Songs
        </div>

        <div class="song-search-container">

          <input
            id="songSearch"
            type="text"
            placeholder="Search another song..."
            autocomplete="off"
          >

          <div id="songSearchResults"></div>

        </div>

      </div>

      <h1 id="songTitle"></h1>

      <div class="transpose">

        <span>
          Transpose
        </span>

        <button
          id="transposeDownButton"
          type="button"
        >
          −
        </button>

        <div id="keyDisplay">
          Key: -
        </div>

        <button
          id="transposeUpButton"
          type="button"
        >
          +
        </button>

      </div>

      <div id="chords"></div>

      <footer class="site-footer">
        🎵 jayrochords.com
        <br>
        © 2026 Jayro
      </footer>

    </div>

  </div>


  <!-- =====================================================
       FIREBASE + APPLICATION
  ===================================================== -->

  <script>

    /* =====================================================
       FIREBASE CONFIG
    ===================================================== */

    const firebaseConfig = {
      apiKey: "AIzaSyDA81ZEdidhOJyUOlN8pIC4Y2zz0o07Wps",
      authDomain: "auth-543a0.firebaseapp.com",
      projectId: "auth-543a0",
      storageBucket: "auth-543a0.firebasestorage.app",
      messagingSenderId: "277890778144",
      appId: "1:277890778144:web:d1476a3e2c8aa61144e845",
      measurementId: "G-7TJHNT3J41"
    };


    /* =====================================================
       INITIALIZE FIREBASE
    ===================================================== */

    let firebaseAuth;

    try {

      firebase.initializeApp(firebaseConfig);

      firebaseAuth = firebase.auth();

      console.log("Firebase initialized successfully.");

    } catch (error) {

      console.error(
        "Firebase initialization error:",
        error
      );

    }


    /* =====================================================
       APPS SCRIPT URL

       THIS IS THE NEW DEPLOYMENT FROM YOUR SCREENSHOT
    ===================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbz0F4RI8oU7aZOD9aKL65da907dLgDlZIF7T_EBm-JGUDDjvsCnLO7zxJbiFePqFRalqA/exec";


    /* =====================================================
       VARIABLES
    ===================================================== */

    let songs = [];

    let currentSong = null;

    let transposeAmount = 0;

    let authReady = false;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loginPage =
      document.getElementById("loginPage");

    const requestPage =
      document.getElementById("requestPage");

    const homePage =
      document.getElementById("homePage");

    const songPage =
      document.getElementById("songPage");

    const loginEmail =
      document.getElementById("loginEmail");

    const loginPassword =
      document.getElementById("loginPassword");

    const loginButton =
      document.getElementById("loginButton");

    const requestButton =
      document.getElementById("requestButton");

    const loginMessage =
      document.getElementById("loginMessage");

    const logoutButton =
      document.getElementById("logoutButton");

    const search =
      document.getElementById("search");

    const songsContainer =
      document.getElementById("songs");

    const message =
      document.getElementById("message");

    const songTitle =
      document.getElementById("songTitle");

    const chords =
      document.getElementById("chords");

    const keyDisplay =
      document.getElementById("keyDisplay");

    const songSearch =
      document.getElementById("songSearch");

    const songSearchResults =
      document.getElementById("songSearchResults");


    /* =====================================================
       PAGE CONTROL
    ===================================================== */

    function showLoginPage() {

      loginPage.style.display = "flex";

      requestPage.style.display = "none";

      homePage.style.display = "none";

      songPage.style.display = "none";

    }


    function showRequestPage() {

      loginPage.style.display = "none";

      requestPage.style.display = "flex";

      homePage.style.display = "none";

      songPage.style.display = "none";

      document.getElementById(
        "requestMessage"
      ).textContent = "";

    }


    function showHome() {

      if (
        !firebaseAuth ||
        !firebaseAuth.currentUser
      ) {

        showLoginPage();

        return;

      }

      loginPage.style.display = "none";

      requestPage.style.display = "none";

      homePage.style.display = "block";

      songPage.style.display = "none";

      window.scrollTo(0, 0);

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    async function login() {

      const email =
        loginEmail.value.trim();

      const password =
        loginPassword.value;

      if (!email) {

        loginMessage.textContent =
          "Please enter your email.";

        return;

      }

      if (!password) {

        loginMessage.textContent =
          "Please enter your password.";

        return;

      }

      if (!firebaseAuth) {

        loginMessage.textContent =
          "Firebase failed to initialize.";

        return;

      }


      loginButton.disabled = true;

      loginButton.textContent =
        "Signing in...";

      loginMessage.textContent = "";


      try {

        const result =
          await firebaseAuth.signInWithEmailAndPassword(
            email,
            password
          );

        console.log(
          "Firebase login successful:",
          result.user.email
        );


        /*
          IMPORTANT:

          We don't manually redirect here.

          onAuthStateChanged below handles
          the successful login.
        */

      } catch (error) {

        console.error(
          "Firebase login error:",
          error
        );

        console.error(
          "Firebase error code:",
          error.code
        );


        switch (error.code) {

          case "auth/invalid-email":

            loginMessage.textContent =
              "Please enter a valid email address.";

            break;


          case "auth/user-not-found":

            loginMessage.textContent =
              "Account not found.";

            break;


          case "auth/wrong-password":

            loginMessage.textContent =
              "Incorrect email or password.";

            break;


          case "auth/invalid-credential":

            loginMessage.textContent =
              "Incorrect email or password.";

            break;


          case "auth/user-disabled":

            loginMessage.textContent =
              "This account has been disabled.";

            break;


          case "auth/too-many-requests":

            loginMessage.textContent =
              "Too many attempts. Please try again later.";

            break;


          case "auth/api-key-not-valid":

            loginMessage.textContent =
              "Firebase API key is invalid.";

            break;


          case "auth/network-request-failed":

            loginMessage.textContent =
              "Network error. Check your internet connection.";

            break;


          default:

            loginMessage.textContent =
              error.message ||
              "Unable to log in.";

        }

      } finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "Login";

      }

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    async function logout() {

      try {

        await firebaseAuth.signOut();

        songs = [];

        currentSong = null;

        transposeAmount = 0;

        loginEmail.value = "";

        loginPassword.value = "";

        loginMessage.textContent = "";

        showLoginPage();

      } catch (error) {

        console.error(
          "Logout error:",
          error
        );

      }

    }


    /* =====================================================
       FIREBASE AUTH STATE
    ===================================================== */

    if (firebaseAuth) {

      firebaseAuth.onAuthStateChanged(
        function(user) {

          authReady = true;

          console.log(
            "Auth state:",
            user
              ? user.email
              : "Not logged in"
          );


          if (user) {

            showHome();

            if (!songs.length) {

              loadSongs();

            }

          } else {

            showLoginPage();

          }

        }
      );

    }


    /* =====================================================
       LOAD SONGS
    ===================================================== */

    function loadSongs() {

      message.textContent =
        "Loading songs...";

      songsContainer.innerHTML = "";


      const callbackName =
        "receiveSongs_" +
        Date.now();


      window[callbackName] =
        function(data) {

          console.log(
            "Songs received:",
            data
          );


          if (Array.isArray(data)) {

            songs = data;

          } else {

            songs = [];

          }


          songs.sort(
            function(a, b) {

              return String(
                a.name || ""
              ).localeCompare(
                String(
                  b.name || ""
                ),
                undefined,
                {
                  sensitivity: "base"
                }
              );

            }
          );


          displaySongs(songs);


          delete window[callbackName];


          const oldScript =
            document.getElementById(
              "songsApiScript"
            );

          if (oldScript) {

            oldScript.remove();

          }

        };


      const script =
        document.createElement(
          "script"
        );


      script.id =
        "songsApiScript";


      script.src =
        API_URL +
        "?callback=" +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          console.error(
            "Unable to load Apps Script."
          );

          message.textContent =
            "Unable to load songs. Please try again.";

          delete window[callbackName];

          script.remove();

        };


      document.body.appendChild(
        script
      );

    }


    /* =====================================================
       DISPLAY SONGS
    ===================================================== */

    function displaySongs(list) {

      songsContainer.innerHTML = "";


      if (
        !list ||
        list.length === 0
      ) {

        message.textContent =
          "No songs found.";

        return;

      }


      message.textContent = "";


      list.forEach(
        function(song) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "song";


          const name =
            document.createElement(
              "div"
            );


          name.className =
            "song-name";


          name.textContent =
            song.name || "Untitled";


          div.appendChild(name);


          div.addEventListener(
            "click",
            function() {

              openSong(song);

            }
          );


          songsContainer.appendChild(
            div
          );

        }
      );

    }


    /* =====================================================
       HOME SEARCH
    ===================================================== */

    search.addEventListener(
      "input",
      function() {

        const text =
          this.value
            .trim()
            .toLowerCase();


        if (!text) {

          displaySongs(songs);

          return;

        }


        const filtered =
          songs.filter(
            function(song) {

              return String(
                song.name || ""
              )
              .toLowerCase()
              .includes(text);

            }
          );


        displaySongs(
          filtered
        );

      }
    );


    /* =====================================================
       SONG SEARCH
    ===================================================== */

    songSearch.addEventListener(
      "input",
      function() {

        const text =
          this.value
            .trim()
            .toLowerCase();


        songSearchResults.innerHTML = "";


        if (!text) {

          songSearchResults.style.display =
            "none";

          return;

        }


        const matches =
          songs.filter(
            function(song) {

              return String(
                song.name || ""
              )
              .toLowerCase()
              .includes(text);

            }
          );


        if (
          matches.length === 0
        ) {

          const noResults =
            document.createElement(
              "div"
            );

          noResults.className =
            "song-search-no-results";

          noResults.textContent =
            "No songs found.";

          songSearchResults.appendChild(
            noResults
          );

          songSearchResults.style.display =
            "block";

          return;

        }


        matches
          .slice(0, 15)
          .forEach(
            function(song) {

              const result =
                document.createElement(
                  "div"
                );


              result.className =
                "song-search-result";


              result.textContent =
                song.name;


              result.addEventListener(
                "click",
                function() {

                  openSong(song);

                }
              );


              songSearchResults.appendChild(
                result
              );

            }
          );


        songSearchResults.style.display =
          "block";

      }
    );


    /* =====================================================
       CLOSE SONG SEARCH
    ===================================================== */

    document.addEventListener(
      "click",
      function(event) {

        const container =
          document.querySelector(
            ".song-search-container"
          );


        if (
          container &&
          !container.contains(
            event.target
          )
        ) {

          songSearchResults.style.display =
            "none";

        }

      }
    );


    /* =====================================================
       OPEN SONG
    ===================================================== */

    function openSong(song) {

      if (!song) {

        return;

      }


      currentSong =
        song;


      transposeAmount =
        0;


      homePage.style.display =
        "none";

      songPage.style.display =
        "block";


      songTitle.textContent =
        song.name || "Untitled";


      songSearch.value =
        "";


      songSearchResults.innerHTML =
        "";


      songSearchResults.style.display =
        "none";


      updateSong();


      window.scrollTo(
        0,
        0
      );

    }


    /* =====================================================
       GET CHORD TEXT
    ===================================================== */

    function getChordText(song) {

      if (!song) {

        return "";

      }


      /*
        Your Apps Script returns:

        {
          name: "...",
          chords: "..."
        }

        So use song.chords.
      */

      return String(
        song.chords ||
        song.notes ||
        song.content ||
        ""
      );

    }


    /* =====================================================
       NOTE MAP
    ===================================================== */

    const noteMap = {

      "C": 0,
      "B#": 0,

      "C#": 1,
      "Db": 1,

      "D": 2,

      "D#": 3,
      "Eb": 3,

      "E": 4,
      "Fb": 4,

      "F": 5,
      "E#": 5,

      "F#": 6,
      "Gb": 6,

      "G": 7,

      "G#": 8,
      "Ab": 8,

      "A": 9,

      "A#": 10,
      "Bb": 10,

      "B": 11,
      "Cb": 11

    };


    const chromaticNotes = [

      "C",
      "C#",
      "D",
      "Eb",
      "E",
      "F",
      "F#",
      "G",
      "G#",
      "A",
      "Bb",
      "B"

    ];


    /* =====================================================
       ORIGINAL KEY
    ===================================================== */

    function getOriginalKey(text) {

      if (!text) {

        return "-";

      }


      /*
        First try a key written at the
        beginning of the song.
      */

      const keyAtStart =
        text.match(
          /^\s*\(?([A-G](?:#|b)?)\)?/
        );


      if (keyAtStart) {

        return keyAtStart[1];

      }


      /*
        Otherwise find the first chord.
      */

      const firstChord =
        text.match(
          /(?:^|[\s(\[])([A-G](?:#|b)?)(?=(?:m|min|maj|dim|aug|sus|add|M|°|[0-9]|\/|[\s)\],;:.]|$))/
        );


      if (!firstChord) {

        return "-";

      }


      return firstChord[1];

    }


    /* =====================================================
       TRANSPOSE CHORD
    ===================================================== */

    function transposeChord(
      chord,
      amount
    ) {

      /*
        Match the root note of a chord.

        Examples:

        C
        Cm
        C7
        Cmaj7
        C#/E
        Bb
        F#m7
      */

      return chord.replace(
        /^([A-G](?:#|b)?)/,
        function(
          full,
          root
        ) {

          if (
            noteMap[root] === undefined
          ) {

            return full;

          }


          let number =
            noteMap[root] +
            amount;


          number =
            number % 12;


          if (
            number < 0
          ) {

            number += 12;

          }


          return chromaticNotes[
            number
          ];

        }
      );

    }


    /* =====================================================
       TRANSPOSE ALL CHORDS
    ===================================================== */

    function transposeText(
      text,
      amount
    ) {

      if (
        !text ||
        amount === 0
      ) {

        return text || "";

      }


      /*
        Replace chord roots while
        keeping normal words untouched.
      */

      return text.replace(
        /(^|[\s(\[])([A-G](?:#|b)?)(?=[A-Za-z0-9°+\/()-]*)(?=[\s)\],;:.]|$)/gm,
        function(
          full,
          before,
          root
        ) {

          if (
            noteMap[root] === undefined
          ) {

            return full;

          }


          return (
            before +
            transposeChord(
              root,
              amount
            )
          );

        }
      );

    }


    /* =====================================================
       DISPLAY KEY
    ===================================================== */

    function getDisplayedKey() {

      if (!currentSong) {

        return "-";

      }


      const text =
        getChordText(
          currentSong
        );


      const originalKey =
        getOriginalKey(
          text
        );


      if (
        noteMap[originalKey] === undefined
      ) {

        return "-";

      }


      let number =
        noteMap[originalKey] +
        transposeAmount;


      number =
        number % 12;


      if (
        number < 0
      ) {

        number += 12;

      }


      return chromaticNotes[
        number
      ];

    }


    /* =====================================================
       UPDATE SONG
    ===================================================== */

    function updateSong() {

      if (!currentSong) {

        return;

      }


      const originalText =
        getChordText(
          currentSong
        );


      const displayedText =
        transposeText(
          originalText,
          transposeAmount
        );


      chords.textContent =
        displayedText ||
        "No chords available.";


      keyDisplay.textContent =
        "Key: " +
        getDisplayedKey();

    }


    /* =====================================================
       TRANSPOSE UP
    ===================================================== */

    function transposeUp() {

      if (!currentSong) {

        return;

      }


      transposeAmount++;

      updateSong();

    }


    /* =====================================================
       TRANSPOSE DOWN
    ===================================================== */

    function transposeDown() {

      if (!currentSong) {

        return;

      }


      transposeAmount--;

      updateSong();

    }


    /* =====================================================
       BUTTON EVENTS
    ===================================================== */

    loginButton.addEventListener(
      "click",
      login
    );


    loginPassword.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          login();

        }

      }
    );


    loginEmail.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          login();

        }

      }
    );


    requestButton.addEventListener(
      "click",
      showRequestPage
    );


    logoutButton.addEventListener(
      "click",
      logout
    );


    document
      .getElementById("backButton")
      .addEventListener(
        "click",
        showHome
      );


    document
      .getElementById(
        "transposeUpButton"
      )
      .addEventListener(
        "click",
        transposeUp
      );


    document
      .getElementById(
        "transposeDownButton"
      )
      .addEventListener(
        "click",
        transposeDown
      );


    /* =====================================================
       REQUEST ACCESS
    ===================================================== */

    document
      .getElementById(
        "backLogin"
      )
      .addEventListener(
        "click",
        showLoginPage
      );


    document
      .getElementById(
        "submitRequestButton"
      )
      .addEventListener(
        "click",
        submitAccessRequest
      );


    function submitAccessRequest() {

      const name =
        document
          .getElementById(
            "requestName"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "requestEmail"
          )
          .value
          .trim();


      const reason =
        document
          .getElementById(
            "requestReason"
          )
          .value
          .trim();


      const requestMessage =
        document
          .getElementById(
            "requestMessage"
          );


      if (!name) {

        requestMessage.textContent =
          "Please enter your name.";

        return;

      }


      if (!email) {

        requestMessage.textContent =
          "Please enter your email.";

        return;

      }


      if (!reason) {

        requestMessage.textContent =
          "Please tell us why you need access.";

        return;

      }


      requestMessage.textContent =
        "Sending request...";


      const callbackName =
        "accessRequest_" +
        Date.now();


      window[callbackName] =
        function(response) {

          console.log(
            "Access request response:",
            response
          );


          requestMessage.textContent =
            response.message ||
            "Request submitted.";


          if (
            response.success
          ) {

            document
              .getElementById(
                "requestName"
              )
              .value = "";


            document
              .getElementById(
                "requestEmail"
              )
              .value = "";


            document
              .getElementById(
                "requestReason"
              )
              .value = "";

          }


          delete window[
            callbackName
          ];


          if (script) {

            script.remove();

          }

        };


      const script =
        document.createElement(
          "script"
        );


      script.src =
        API_URL +
        "?action=requestAccess" +
        "&name=" +
        encodeURIComponent(
          name
        ) +
        "&email=" +
        encodeURIComponent(
          email
        ) +
        "&reason=" +
        encodeURIComponent(
          reason
        ) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          requestMessage.textContent =
            "Unable to send request. Please try again.";

          delete window[
            callbackName
          ];

          script.remove();

        };


      document.body.appendChild(
        script
      );

    }


    /* =====================================================
       INITIAL PAGE
    ===================================================== */

    showLoginPage();

  </script>

</body>
</html>
