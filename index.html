<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VCCF Peymous Songs List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: #0f172a;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 32px;
    }

    #search {
      width: 90%;
      max-width: 500px;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    #songs {
      width: 90%;
      max-width: 700px;
      margin: 20px auto;
    }

    .song {
      background: #1e293b;
      margin-bottom: 10px;
      padding: 17px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .song:hover {
      background: #334155;
      transform: translateY(-1px);
    }

    #message {
      text-align: center;
      margin: 30px;
      color: #94a3b8;
    }

    #songPage {
      display: none;
      width: 90%;
      max-width: 800px;
      margin: 30px auto;
      padding-bottom: 50px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 16px;
    }

    .back:hover {
      color: white;
    }

    #songTitle {
      font-size: 34px;
      margin-bottom: 20px;
    }

    .transpose {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
      padding: 15px;
      background: #1e293b;
      border-radius: 10px;
    }

    .transpose button {
      width: 45px;
      height: 40px;
      border: none;
      border-radius: 8px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      background: #334155;
      color: white;
    }

    .transpose button:hover {
      background: #475569;
    }

    #keyDisplay {
      min-width: 100px;
      text-align: center;
      font-weight: bold;
    }

    #chords {
      background: #111827;
      border-radius: 10px;
      padding: 25px;
      white-space: pre-wrap;
      font-family: "Courier New", monospace;
      font-size: 18px;
      line-height: 1.7;
      overflow-x: auto;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 25px;
      }

      #songTitle {
        font-size: 28px;
      }

      #chords {
        font-size: 16px;
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- SONG LIST -->
  <div id="homePage">

    <header>
      <h1>🎵 VCCF Peymous Songs List</h1>

      <input
        type="text"
        id="search"
        placeholder="Search song..."
        autocomplete="off"
      >
    </header>

    <div id="songs"></div>

    <div id="message">
      Loading songs...
    </div>

  </div>


  <!-- SONG PAGE -->
  <div id="songPage">

    <div class="back" onclick="showHome()">
      ← Back to Songs
    </div>

    <h1 id="songTitle"></h1>

    <!-- TRANSPOSE -->
    <div class="transpose">

      <button onclick="transposeDown()">−</button>

      <div id="keyDisplay">
        Key: -
      </div>

      <button onclick="transposeUp()">+</button>

    </div>

    <div id="chords"></div>

  </div>


<script>

  /*
   * YOUR GOOGLE APPS SCRIPT URL
   */
  const API_URL =
    "https://script.google.com/macros/s/AKfycbyAbVFUV4zRmG9luRmr4sNeBB1H7OJZpIu5bghyfbZtvLaPr2sEm5Jo5W0qI8HkUdy9HQ/exec";


  let songs = [];

  let currentSong = null;

  let transposeAmount = 0;


  /*
   * LOAD SONGS
   *
   * JSONP is used because the Google Apps Script
   * is hosted on a different domain than Vercel.
   */
  function loadSongs() {

    const callbackName =
      "receiveSongs_" + Date.now();

    window[callbackName] = function(data) {

      songs = Array.isArray(data) ? data : [];

      delete window[callbackName];

      const oldScript =
        document.getElementById("apiScript");

      if (oldScript) {
        oldScript.remove();
      }

      displaySongs(songs);
    };


    const script =
      document.createElement("script");

    script.id = "apiScript";

    script.src =
      API_URL +
      "?callback=" +
      callbackName;

    script.onerror = function() {

      document.getElementById("message").textContent =
        "Unable to load songs. Please try again.";

      delete window[callbackName];

      script.remove();
    };

    document.body.appendChild(script);
  }


  /*
   * DISPLAY SONG LIST
   */
  function displaySongs(list) {

    const container =
      document.getElementById("songs");

    const message =
      document.getElementById("message");

    container.innerHTML = "";


    if (!list || list.length === 0) {

      message.textContent =
        "No songs found.";

      return;
    }


    message.textContent = "";


    list.forEach(function(song) {

      const div =
        document.createElement("div");

      div.className = "song";

      div.textContent = song.name;

      div.onclick = function() {
        openSong(song);
      };

      container.appendChild(div);

    });
  }


  /*
   * SEARCH
   */
  document
    .getElementById("search")
    .addEventListener("input", function() {

      const searchText =
        this.value
          .trim()
          .toLowerCase();


      if (!searchText) {

        displaySongs(songs);

        return;
      }


      const filtered =
        songs.filter(function(song) {

          return String(song.name || "")
            .toLowerCase()
            .includes(searchText);

        });


      displaySongs(filtered);

    });


  /*
   * OPEN SONG
   */
  function openSong(song) {

    currentSong = song;

    transposeAmount = 0;


    document.getElementById("homePage")
      .style.display = "none";


    document.getElementById("songPage")
      .style.display = "block";


    document.getElementById("songTitle")
      .textContent = song.name;


    updateSong();


    window.scrollTo(0, 0);
  }


  /*
   * RETURN TO SONG LIST
   */
  function showHome() {

    currentSong = null;

    transposeAmount = 0;


    document.getElementById("songPage")
      .style.display = "none";


    document.getElementById("homePage")
      .style.display = "block";


    window.scrollTo(0, 0);

  }


  /*
   * TRANSPOSE UP
   */
  function transposeUp() {

    if (!currentSong) {
      return;
    }

    transposeAmount++;

    updateSong();

  }


  /*
   * TRANSPOSE DOWN
   */
  function transposeDown() {

    if (!currentSong) {
      return;
    }

    transposeAmount--;

    updateSong();

  }


  /*
   * UPDATE DISPLAYED SONG
   */
  function updateSong() {

    if (!currentSong) {
      return;
    }


    const original =
      String(currentSong.chords || "");


    const transposed =
      transposeChords(
        original,
        transposeAmount
      );


    document.getElementById("chords")
      .textContent = transposed;


    const key =
      getDisplayedKey(
        original,
        transposeAmount
      );


    document.getElementById("keyDisplay")
      .textContent =
        "Key: " + key;

  }


  /*
   * CHROMATIC NOTES
   *
   * Flats are used for display when appropriate.
   */
  const chromaticNotes = [
    "C",
    "C#",
    "D",
    "Eb",
    "E",
    "F",
    "F#",
    "G",
    "Ab",
    "A",
    "Bb",
    "B"
  ];


  /*
   * CONVERT NOTE TO NUMBER
   */
  function noteToNumber(note) {

    const map = {
      "C": 0,
      "B#": 0,

      "C#": 1,
      "Db": 1,

      "D": 2,

      "D#": 3,
      "Eb": 3,

      "E": 4,
      "Fb": 4,

      "F": 5,
      "E#": 5,

      "F#": 6,
      "Gb": 6,

      "G": 7,

      "G#": 8,
      "Ab": 8,

      "A": 9,

      "A#": 10,
      "Bb": 10,

      "B": 11,
      "Cb": 11
    };


    return map[note];
  }


  /*
   * TRANSPOSE A SINGLE CHORD
   *
   * Examples:
   *
   * D       → Eb
   * D/F#    → Eb/G
   * Bm      → Cm
   * A/C#    → Bb/D
   */
  function transposeChord(chord, amount) {

    const match =
      chord.match(
        /^([A-G](?:#|b)?)(.*)$/
      );


    if (!match) {
      return chord;
    }


    const root =
      match[1];

    const suffix =
      match[2];


    const rootNumber =
      noteToNumber(root);


    if (rootNumber === undefined) {
      return chord;
    }


    let newRootNumber =
      (rootNumber + amount) % 12;


    if (newRootNumber < 0) {
      newRootNumber += 12;
    }


    let newChord =
      chromaticNotes[newRootNumber] +
      suffix;


    /*
     * Handle slash chords.
     */
    const slashMatch =
      suffix.match(
        /^([^/]*)\/([A-G](?:#|b)?)(.*)$/
      );


    if (slashMatch) {

      const beforeSlash =
        slashMatch[1];

      const bass =
        slashMatch[2];

      const afterBass =
        slashMatch[3];


      const bassNumber =
        noteToNumber(bass);


      if (bassNumber !== undefined) {

        let newBassNumber =
          (bassNumber + amount) % 12;


        if (newBassNumber < 0) {
          newBassNumber += 12;
        }


        newChord =
          chromaticNotes[newRootNumber] +
          beforeSlash +
          "/" +
          chromaticNotes[newBassNumber] +
          afterBass;
      }
    }


    return newChord;
  }


  /*
   * TRANSPOSE ALL CHORDS
   *
   * We only transpose chord-looking text.
   * Normal lyrics/text are left alone.
   */
  function transposeChords(text, amount) {

    if (!text || amount === 0) {
      return text;
    }


    return text.replace(
      /(^|[\s|(\[])([A-G](?:#|b)?(?:m|maj|min|dim|aug|sus|add|7|9|11|13|M|°|\+|-)*(?:\/[A-G](?:#|b)?)?)(?=$|[\s|)\],:;])/gm,
      function(full, prefix, chord) {

        return prefix +
          transposeChord(
            chord,
            amount
          );

      }
    );
  }


  /*
   * FIND THE ORIGINAL KEY
   *
   * Looks for the first chord in the song.
   */
  function getOriginalKey(text) {

    if (!text) {
      return "-";
    }


    const match =
      text.match(
        /(?:^|[\s|(\[])([A-G](?:#|b)?)(?=m|maj|min|dim|aug|sus|add|7|9|11|13|\/|\s|$|[\]|):,;])/m
      );


    if (!match) {
      return "-";
    }


    return match[1];

  }


  /*
   * GET DISPLAYED KEY
   */
  function getDisplayedKey(text, amount) {

    const originalKey =
      getOriginalKey(text);


    const number =
      noteToNumber(originalKey);


    if (number === undefined) {
      return "-";
    }


    let newNumber =
      (number + amount) % 12;


    if (newNumber < 0) {
      newNumber += 12;
    }


    return chromaticNotes[newNumber];

  }


  /*
   * START
   */
  loadSongs();

</script>

</body>
</html>
