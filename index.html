<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VCCF Peymous Songs List</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: #0f172a;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 32px;
    }

    #search {
      width: 90%;
      max-width: 500px;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    #songs {
      width: 90%;
      max-width: 700px;
      margin: 20px auto;
    }

    .song {
      background: #1e293b;
      margin-bottom: 10px;
      padding: 17px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .song:hover {
      background: #334155;
      transform: translateY(-1px);
    }

    #message {
      text-align: center;
      margin: 30px;
      color: #94a3b8;
    }

    /* SONG PAGE */

    #songPage {
      display: none;
      width: 90%;
      max-width: 800px;
      margin: 30px auto;
      padding-bottom: 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      cursor: pointer;
      color: #60a5fa;
      font-size: 16px;
      font-weight: bold;
    }

    .back:hover {
      color: #93c5fd;
    }

    #songTitle {
      font-size: 34px;
      margin-bottom: 20px;
    }

    /* TRANSPOSE */

    .transpose {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
      padding: 15px;
      background: #1e293b;
      border-radius: 10px;
    }

    .transpose-label {
      font-weight: bold;
    }

    .transpose button {
      width: 45px;
      height: 40px;
      border: none;
      border-radius: 8px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      background: #334155;
      color: white;
    }

    .transpose button:hover {
      background: #475569;
    }

    #keyDisplay {
      min-width: 80px;
      text-align: center;
      font-weight: bold;
    }

    /* CHORDS */

    #chords {
      background: #111827;
      border-radius: 10px;
      padding: 25px;
      white-space: pre-wrap;
      font-family: "Courier New", monospace;
      font-size: 18px;
      line-height: 1.7;
      overflow-x: auto;
    }

    /* FEEDBACK */

    .feedback-section {
      margin-top: 35px;
      padding: 22px;
      background: #1e293b;
      border-radius: 12px;
    }

    .feedback-section h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .feedback-description {
      margin: 0 0 18px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }

    .feedback-input,
    .feedback-textarea {
      width: 100%;
      border: none;
      outline: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin-bottom: 12px;
    }

    .feedback-input::placeholder,
    .feedback-textarea::placeholder {
      color: #64748b;
    }

    .feedback-textarea {
      min-height: 120px;
      resize: vertical;
    }

    .feedback-button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 13px;
      background: #3b82f6;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .feedback-button:hover {
      background: #2563eb;
    }

    .feedback-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #feedbackStatus {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: #94a3b8;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      h1 {
        font-size: 25px;
      }

      #songTitle {
        font-size: 28px;
      }

      #chords {
        font-size: 16px;
        padding: 18px;
      }

      .transpose {
        gap: 10px;
      }

      .feedback-section {
        padding: 18px;
      }

    }

  </style>

</head>


<body>


  <!-- ==========================
       HOME / SONG LIST
  =========================== -->

  <div id="homePage">

    <header>

      <h1>
        🎵 VCCF Peymous Songs List
      </h1>

      <input
        type="text"
        id="search"
        placeholder="Search song..."
        autocomplete="off"
      >

    </header>


    <div id="songs"></div>


    <div id="message">
      Loading songs...
    </div>

  </div>



  <!-- ==========================
       SONG PAGE
  =========================== -->

  <div id="songPage">


    <div
      class="back"
      onclick="showHome()"
    >
      ← Back to Songs
    </div>


    <h1 id="songTitle"></h1>


    <!-- TRANSPOSE -->

    <div class="transpose">

      <span class="transpose-label">
        Transpose
      </span>


      <button
        onclick="transposeDown()"
        aria-label="Transpose down"
      >
        −
      </button>


      <div id="keyDisplay">
        Key: -
      </div>


      <button
        onclick="transposeUp()"
        aria-label="Transpose up"
      >
        +
      </button>

    </div>


    <!-- CHORDS -->

    <div id="chords"></div>



    <!-- ==========================
         CHORD FEEDBACK
    =========================== -->

    <div class="feedback-section">

      <h2>
        🎸 Chord Feedback
      </h2>


      <p class="feedback-description">
        Found an incorrect chord or have a suggestion?
        Let me know.
      </p>


      <input
        type="text"
        id="feedbackName"
        class="feedback-input"
        placeholder="Your name (optional)"
        maxlength="100"
      >


      <textarea
        id="feedbackText"
        class="feedback-textarea"
        placeholder="Write your feedback, correction, or question..."
        maxlength="2000"
      ></textarea>


      <button
        id="feedbackButton"
        class="feedback-button"
        onclick="submitFeedback()"
      >
        Send Feedback
      </button>


      <div id="feedbackStatus"></div>

    </div>


  </div>



<script>


  // ==========================================
  // GOOGLE APPS SCRIPT URL
  // ==========================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyAbVFUV4zRmG9luRmr4sNeBB1H7OJZpIu5bghyfbZtvLaPr2sEm5Jo5W0qI8HkUdy9HQ/exec";


  let songs = [];

  let currentSong = null;

  let transposeAmount = 0;



  // ==========================================
  // LOAD SONGS
  // ==========================================

  function loadSongs() {

    const callbackName =
      "receiveSongs_" + Date.now();


    window[callbackName] =
      function(data) {

        songs =
          Array.isArray(data)
            ? data
            : [];


        delete window[callbackName];


        const oldScript =
          document.getElementById(
            "apiScript"
          );


        if (oldScript) {
          oldScript.remove();
        }


        displaySongs(songs);

      };


    const script =
      document.createElement("script");


    script.id =
      "apiScript";


    script.src =
      API_URL +
      "?callback=" +
      callbackName;


    script.onerror =
      function() {

        document
          .getElementById("message")
          .textContent =
          "Unable to load songs. Please try again.";


        delete window[callbackName];

        script.remove();

      };


    document
      .body
      .appendChild(script);

  }



  // ==========================================
  // DISPLAY SONGS
  // ==========================================

  function displaySongs(list) {

    const container =
      document.getElementById(
        "songs"
      );


    const message =
      document.getElementById(
        "message"
      );


    container.innerHTML =
      "";


    if (
      !list ||
      list.length === 0
    ) {

      message.textContent =
        "No songs found.";

      return;

    }


    message.textContent =
      "";


    list.forEach(
      function(song) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "song";


        div.textContent =
          song.name;


        div.onclick =
          function() {

            openSong(song);

          };


        container.appendChild(
          div
        );

      }
    );

  }



  // ==========================================
  // SEARCH
  // ==========================================

  document
    .getElementById("search")
    .addEventListener(
      "input",
      function() {

        const searchText =
          this.value
            .trim()
            .toLowerCase();


        if (!searchText) {

          displaySongs(songs);

          return;

        }


        const filtered =
          songs.filter(
            function(song) {

              return String(
                song.name || ""
              )
                .toLowerCase()
                .includes(
                  searchText
                );

            }
          );


        displaySongs(
          filtered
        );

      }
    );



  // ==========================================
  // OPEN SONG
  // ==========================================

  function openSong(song) {

    currentSong =
      song;


    transposeAmount =
      0;


    document
      .getElementById(
        "homePage"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "songPage"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "songTitle"
      )
      .textContent =
      song.name;


    document
      .getElementById(
        "feedbackName"
      )
      .value =
      "";


    document
      .getElementById(
        "feedbackText"
      )
      .value =
      "";


    document
      .getElementById(
        "feedbackStatus"
      )
      .textContent =
      "";


    updateSong();


    window.scrollTo(
      0,
      0
    );

  }



  // ==========================================
  // BACK TO HOME
  // ==========================================

  function showHome() {

    currentSong =
      null;


    transposeAmount =
      0;


    document
      .getElementById(
        "songPage"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "homePage"
      )
      .style.display =
      "block";


    window.scrollTo(
      0,
      0
    );

  }



  // ==========================================
  // TRANSPOSE UP
  // ==========================================

  function transposeUp() {

    if (!currentSong) {
      return;
    }


    transposeAmount++;


    updateSong();

  }



  // ==========================================
  // TRANSPOSE DOWN
  // ==========================================

  function transposeDown() {

    if (!currentSong) {
      return;
    }


    transposeAmount--;


    updateSong();

  }



  // ==========================================
  // UPDATE SONG
  // ==========================================

  function updateSong() {

    if (!currentSong) {
      return;
    }


    const original =
      String(
        currentSong.chords || ""
      );


    const transposed =
      transposeChords(
        original,
        transposeAmount
      );


    document
      .getElementById(
        "chords"
      )
      .textContent =
      transposed;


    const key =
      getDisplayedKey(
        original,
        transposeAmount
      );


    document
      .getElementById(
        "keyDisplay"
      )
      .textContent =
      "Key: " + key;

  }



  // ==========================================
  // NOTE MAP
  // ==========================================

  const chromaticNotes = [

    "C",
    "C#",
    "D",
    "Eb",
    "E",
    "F",
    "F#",
    "G",
    "Ab",
    "A",
    "Bb",
    "B"

  ];



  function noteToNumber(note) {

    const map = {

      "C": 0,
      "B#": 0,

      "C#": 1,
      "Db": 1,

      "D": 2,

      "D#": 3,
      "Eb": 3,

      "E": 4,
      "Fb": 4,

      "F": 5,
      "E#": 5,

      "F#": 6,
      "Gb": 6,

      "G": 7,

      "G#": 8,
      "Ab": 8,

      "A": 9,

      "A#": 10,
      "Bb": 10,

      "B": 11,
      "Cb": 11

    };


    return map[note];

  }



  // ==========================================
  // TRANSPOSE CHORD
  // ==========================================

  function transposeChord(
    chord,
    amount
  ) {

    const match =
      chord.match(
        /^([A-G](?:#|b)?)(.*)$/
      );


    if (!match) {
      return chord;
    }


    const root =
      match[1];


    const suffix =
      match[2];


    const rootNumber =
      noteToNumber(
        root
      );


    if (
      rootNumber === undefined
    ) {

      return chord;

    }


    let newRootNumber =
      (
        rootNumber +
        amount
      ) % 12;


    if (
      newRootNumber < 0
    ) {

      newRootNumber +=
        12;

    }


    return (
      chromaticNotes[
        newRootNumber
      ] +
      suffix
    );

  }



  // ==========================================
  // TRANSPOSE ALL CHORDS
  // ==========================================

  function transposeChords(
    text,
    amount
  ) {

    if (
      !text ||
      amount === 0
    ) {

      return text;

    }


    /*
     * Match chord symbols while
     * avoiding normal words.
     */

    return text.replace(

      /(^|[\s|(\[])([A-G](?:#|b)?(?:m|maj|min|dim|aug|sus|add|7|9|11|13|M|°|\+|-)*(?:\/[A-G](?:#|b)?)?)(?=$|[\s|)\],:;])/gm,

      function(
        full,
        prefix,
        chord
      ) {

        return (
          prefix +
          transposeChord(
            chord,
            amount
          )
        );

      }

    );

  }



  // ==========================================
  // GET ORIGINAL KEY
  // ==========================================

  function getOriginalKey(
    text
  ) {

    if (!text) {
      return "-";
    }


    const match =
      text.match(

        /(?:^|[\s|(\[])([A-G](?:#|b)?)(?=m|maj|min|dim|aug|sus|add|7|9|11|13|\/|\s|$|[\]|):,;])/m

      );


    if (!match) {
      return "-";
    }


    return match[1];

  }



  // ==========================================
  // GET DISPLAYED KEY
  // ==========================================

  function getDisplayedKey(
    text,
    amount
  ) {

    const originalKey =
      getOriginalKey(
        text
      );


    const number =
      noteToNumber(
        originalKey
      );


    if (
      number === undefined
    ) {

      return "-";

    }


    let newNumber =
      (
        number +
        amount
      ) % 12;


    if (
      newNumber < 0
    ) {

      newNumber +=
        12;

    }


    return chromaticNotes[
      newNumber
    ];

  }



  // ==========================================
  // SUBMIT CHORD FEEDBACK
  // ==========================================

  function submitFeedback() {

    if (!currentSong) {
      return;
    }


    const name =
      document
        .getElementById(
          "feedbackName"
        )
        .value
        .trim();


    const feedback =
      document
        .getElementById(
          "feedbackText"
        )
        .value
        .trim();


    const button =
      document
        .getElementById(
          "feedbackButton"
        );


    const status =
      document
        .getElementById(
          "feedbackStatus"
        );


    if (!feedback) {

      status.textContent =
        "Please write some feedback first.";

      return;

    }


    button.disabled =
      true;


    button.textContent =
      "Sending...";


    status.textContent =
      "";


    /*
     * Use a hidden form submission.
     *
     * This allows the Vercel website
     * to send data to Google Apps Script
     * without CORS problems.
     */

    const form =
      document.createElement(
        "form"
      );


    form.method =
      "GET";


    form.action =
      API_URL;


    form.target =
      "feedbackFrame";


    const actionInput =
      document.createElement(
        "input"
      );


    actionInput.type =
      "hidden";


    actionInput.name =
      "action";


    actionInput.value =
      "feedback";


    form.appendChild(
      actionInput
    );


    const songInput =
      document.createElement(
        "input"
      );


    songInput.type =
      "hidden";


    songInput.name =
      "song";


    songInput.value =
      currentSong.name;


    form.appendChild(
      songInput
    );


    const nameInput =
      document.createElement(
        "input"
      );


    nameInput.type =
      "hidden";


    nameInput.name =
      "name";


    nameInput.value =
      name || "Anonymous";


    form.appendChild(
      nameInput
    );


    const feedbackInput =
      document.createElement(
        "input"
      );


    feedbackInput.type =
      "hidden";


    feedbackInput.name =
      "feedback";


    feedbackInput.value =
      feedback;


    form.appendChild(
      feedbackInput
    );


    document.body.appendChild(
      form
    );


    form.submit();


    form.remove();


    /*
     * Show success message.
     */

    setTimeout(
      function() {

        button.disabled =
          false;


        button.textContent =
          "Send Feedback";


        status.textContent =
          "✅ Thanks! Your feedback has been sent.";


        document
          .getElementById(
            "feedbackText"
          )
          .value =
          "";

      },
      800
    );

  }



  // ==========================================
  // HIDDEN FRAME FOR FEEDBACK
  // ==========================================

  const feedbackFrame =
    document.createElement(
      "iframe"
    );


  feedbackFrame.name =
    "feedbackFrame";


  feedbackFrame.style.display =
    "none";


  document.body.appendChild(
    feedbackFrame
  );



  // ==========================================
  // START
  // ==========================================

  loadSongs();


</script>


</body>
</html>
